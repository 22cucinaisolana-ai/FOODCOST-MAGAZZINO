<script>
/* ===== Collegamento a Supabase (chiave pubblica, i dati sono protetti dal login) ===== */
const SUPABASE_URL = 'https://sfnpfjhicjftlcrnvjgc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmbnBmamhpY2pmdGxjcm52amdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTk3MDQsImV4cCI6MjEwNTM3NTcwNH0.9X9anV3CfsGEJM4lRsZSNlJ65gY1ifzhEgaZOl5DZfE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== Stato ===== */
const S = {fornitori:[],prodotti:[],prep:[],carichi:[],movimenti:[],mpiatti_mov:[],servizi:[],piatti:[],pcomp:[],menu:[],mpiatti:[]};
const TAB = {fornitori:'fornitori',prodotti:'prodotti',prep:'prep_componenti',carichi:'carichi',movimenti:'movimenti',mpiatti_mov:'movimenti_piatti',servizi:'servizi',piatti:'piatti',pcomp:'piatto_componenti',menu:'menu',mpiatti:'menu_piatti'};
const CATEGORIE = ['pesce','crostacei','carne','pasta','verdura','frutta','latticini','dispensa','pane','preparazione','pulizia','materiali','altro'];
const NON_FOOD = new Set(['pulizia','materiali']);
const isFood = p => p && !NON_FOOD.has(p.categoria);
const PORTATE = ['pane e benvenuto','antipasto','primo','secondo','dessert','piccola pasticceria','altro'];
const U = {g:{big:'kg',mul:1000,small:'g',nome:'grammi'}, ml:{big:'litri',mul:1000,small:'ml',nome:'millilitri'}, pz:{big:'pezzi',mul:1,small:'pz',nome:'pezzi'}};
const UM = {g:['g',1], kg:['g',1000], ml:['ml',1], L:['ml',1000], pz:['pz',1]};
const UM_PER = {g:['g','kg'], ml:['ml','L'], pz:['pz']};
function trovaProdotto(testo, escludi){
  const t=String(testo||'').trim().toLowerCase(); if(!t) return null;
  const att=S.prodotti.filter(p=>p.attivo && p.id!==escludi && isFood(p));
  return att.find(p=>p.nome.toLowerCase()===t) || (x=>x.length===1?x[0]:null)(att.filter(p=>p.nome.toLowerCase().includes(t)));
}
/* quanti g / ml / pz ci sono in 1 unita della fattura */
function contenuto(p){
  if(!p) return null;
  if(+p.contenuto_conf>0) return +p.contenuto_conf;
  const um=(p.um_acquisto||'').toUpperCase();
  if(p.unita==='g' && (um==='KG'||um==='KGM')) return 1000;
  if(p.unita==='g' && (um==='G'||um==='GR')) return 1;
  if(p.unita==='ml' && (um==='L'||um==='LT')) return 1000;
  if(p.unita==='ml' && um==='ML') return 1;
  const m=String(p.confezione||'').toLowerCase().replace(',','.').match(/(\d+(?:\.\d+)?)\s*(kg|gr|g|lt|l|cl|ml)\b/);
  if(m){ const n=+m[1], u=m[2];
    if(p.unita==='g'){ if(u==='kg') return n*1000; if(u==='g'||u==='gr') return n; }
    if(p.unita==='ml'){ if(u==='l'||u==='lt') return n*1000; if(u==='cl') return n*10; if(u==='ml') return n; } }
  if(p.unita==='pz' && (um==='PZ'||um==='NR'||um==='PCE')) return 1;
  return null;
}
const umFatt = p => (p.um_acquisto||'').toUpperCase();
function descrUnitaFattura(p){ const c=contenuto(p); if(!c) return ''; return `${umFatt(p)||'unità'} da ${fq(p,c)}`; }
const TIPI_MOV = {in_linea:'In linea',rientro:'Rientro in magazzino',venduto:'Venduto',surplus:'Venduto dal magazzino (surplus)',scarto:'Scarto',pasto_personale:'Pasto personale',rettifica:'Differenza alla conta',uso_produzione:'Usato per preparazione'};

const localISO = (d=new Date()) => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return localISO(d); };
const ui = {
  tab:'servizio', user:null,
  svData: localISO(), svTurno: new Date().getHours()<16 ? 'pranzo' : 'cena',
  editProdotto:null, editFornitore:null, ordProd:{k:'nome',d:1}, ordForn:{k:'nome',d:1}, filtroForn:'tutti', filtroCatProd:'tutte', editPiatto:null, editMenu:null, catFiltro:'tutte',
  coDa: localISO(new Date(new Date().getFullYear(), new Date().getMonth(), 1)), coA: localISO(), incasso:''
};
const OPEN = new Set((()=>{try{return JSON.parse(localStorage.getItem('22open2'))}catch{return null}})() || ['sv-linea','sv-porta','sv-vendite','ca-nuovo','ma-giac','sc-piatti','re-calc','re-storico','co-sintesi']);

/* ===== Utilità ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseN = v => { const n = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const eur = n => (isFinite(n)?n:0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const num = (n,d=1) => (isFinite(n)?n:0).toLocaleString('it-IT',{maximumFractionDigits:d});
const pct = n => isFinite(n) ? num(n,1)+'%' : '—';
const dataIt = iso => iso ? new Date(iso+'T12:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}) : '';
const byNome = (a,b) => a.nome.localeCompare(b.nome,'it');
const P = id => S.prodotti.find(p => p.id === id);
const PI = id => S.piatti.find(p => p.id === id);
const F = id => S.fornitori.find(f => f.id === id);
const nomeForn = p => F(p.fornitore_id)?.nome || p.fornitore || '';
/* quantita in unita base (g, ml, pz) scritta in modo leggibile */
function fq(pid, q){
  const p = typeof pid==='object' ? pid : P(pid); if(!p) return num(q);
  const u = U[p.unita]; const neg = q<0 ? '−' : ''; const a = Math.abs(q);
  if(p.unita==='pz') return neg+num(a,1)+' pz';
  return a>=1000 ? neg+num(a/1000,2)+' '+(p.unita==='g'?'kg':'L') : neg+num(a,0)+' '+u.small;
}
/* costo per unita base mostrato al kg / litro / pezzo */
function fc(p, c){ if(!p) return eur(c); return p.unita==='pz' ? eur(c)+' /pz' : eur(c*1000)+(p.unita==='g'?' /kg':' /L'); }

function toast(msg, tipo){ const t=$('#toast'); t.textContent=msg; t.className=tipo==='err'?'err':''; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 3800); }
function busy(on){ $('#busy').style.display = on ? 'block' : 'none'; }

async function fetchAll(t){
  let out=[], from=0;
  for(;;){ const {data,error} = await sb.from(t).select('*').range(from, from+999); if(error) throw error; out = out.concat(data); if(data.length<1000) break; from+=1000; }
  return out;
}
async function loadAll(){
  const k=Object.keys(TAB); const r=await Promise.all(k.map(x=>fetchAll(TAB[x]))); k.forEach((x,i)=>S[x]=r[i]);
  S.prodotti = S.prodotti.filter(p=>p.reparto!=='sala');
}
async function run(fn, okMsg){
  try{ busy(true); await fn(); await loadAll(); render(); if(okMsg) toast(okMsg); }
  catch(e){ console.error(e); toast('Errore: '+(e.message||e),'err'); }
  finally{ busy(false); }
}
async function ins(t, rows){ const {error} = await sb.from(t).insert(rows); if(error) throw error; }
async function insOne(t, row){ const {data,error} = await sb.from(t).insert(row).select().single(); if(error) throw error; return data; }
async function upd(t, id, row){ const {error} = await sb.from(t).update(row).eq('id', id); if(error) throw error; }
async function del(t, id){ const {error} = await sb.from(t).delete().eq('id', id); if(error) throw error; }

/* ===== Calcoli ===== */
function stock(pid, upTo){
  let mag=0, lin=0;
  for(const c of S.carichi) if(c.prodotto_id===pid && (!upTo || c.data<=upTo)) mag += +c.quantita;
  for(const m of S.movimenti) if(m.prodotto_id===pid && (!upTo || m.data<=upTo)){
    const q = +m.quantita;
    if(m.a==='magazzino') mag+=q; if(m.a==='linea') lin+=q;
    if(m.da==='magazzino') mag-=q; if(m.da==='linea') lin-=q;
  }
  return {mag, lin};
}
/* € per unita base: ultimo carico, oppure dalla ricetta se e una preparazione */
function costo(pid, seen=new Set()){
  const cs = S.carichi.filter(c=>c.prodotto_id===pid && +c.quantita>0)
    .sort((a,b)=> (b.data+b.created_at).localeCompare(a.data+a.created_at));
  if(cs.length) return +cs[0].costo_unitario;
  const p = P(pid); if(!p) return 0;
  if(p.categoria==='preparazione' && !seen.has(pid)){ seen.add(pid); const r=+p.resa_quantita||0; return r ? costoLotto(pid, seen)/r : 0; }
  /* nessun carico: dall'ultimo prezzo di fattura diviso il contenuto della confezione */
  const c=contenuto(p);
  if(p.ultimo_prezzo!=null && c) return +p.ultimo_prezzo/c;
  return 0;
}
/* quota IVA di un prodotto (0,10 = 10%); per le preparazioni si ricava dagli ingredienti */
function ivaEff(pid, seen=new Set()){
  const p=P(pid); if(!p) return 0;
  if(p.categoria==='preparazione' && !seen.has(pid)){ seen.add(pid); const base=costoLotto(pid,new Set(seen)); return base>0 ? costoLottoIva(pid,new Set(seen))/base - 1 : 0; }
  return (+p.iva_pct||0)/100;
}
const costoIvato = (pid, seen=new Set()) => costo(pid, new Set(seen))*(1+ivaEff(pid, new Set(seen)));
function costoLottoIva(pid, seen=new Set()){ return S.prep.filter(r=>r.prep_id===pid).reduce((s,r)=>s + +r.quantita*costoIvato(r.prodotto_id, seen), 0); }
function costoLotto(pid, seen=new Set()){ return S.prep.filter(r=>r.prep_id===pid).reduce((s,r)=>s + +r.quantita*costo(r.prodotto_id, new Set(seen)), 0); }
const compPiatto = id => S.pcomp.filter(c=>c.piatto_id===id);
function costoPiatto(id){ return compPiatto(id).reduce((s,c)=>s + +c.quantita*costo(c.prodotto_id), 0); }
function costoPiattoIva(id){ return compPiatto(id).reduce((s,c)=>s + +c.quantita*costoIvato(c.prodotto_id), 0); }
function costoMenuIva(id){ return S.mpiatti.filter(x=>x.menu_id===id).reduce((s,x)=>s + costoPiattoIva(x.piatto_id), 0); }
function costoMenu(id){ return S.mpiatti.filter(x=>x.menu_id===id).reduce((s,x)=>s + costoPiatto(x.piatto_id), 0); }
function valore(upTo, filtro=isFood){ return S.prodotti.filter(filtro).reduce((s,p)=>{ const st=stock(p.id, upTo); return s + (st.mag+st.lin)*costo(p.id); }, 0); }
/* porzioni di un piatto oggi in linea */
function porzioniLinea(piattoId){
  let n=0;
  for(const m of S.mpiatti_mov) if(m.piatto_id===piattoId){
    const q=+m.porzioni;
    if(m.a==='linea') n+=q;
    if(m.da==='linea') n-=q;
  }
  return n;
}
/* quante porzioni si possono fare con quello che c'e in magazzino */
function porzioniPossibili(piattoId){
  const cc = compPiatto(piattoId); if(!cc.length) return null;
  return Math.max(0, Math.min(...cc.map(c=>Math.floor(stock(c.prodotto_id).mag / +c.quantita + 1e-9))));
}

/* ===== Ordinamento ===== */
const cmpVal = (a,b) => (a==null||a==='') - (b==null||b==='') || (typeof a==='number' && typeof b==='number' ? a-b : String(a).localeCompare(String(b),'it',{numeric:true}));
function ordina(lista, ord, chiavi){ const f=chiavi[ord.k]||chiavi.nome; return [...lista].sort((x,y)=>{ const c=cmpVal(f(x),f(y)); return c ? c*ord.d : x.nome.localeCompare(y.nome,'it'); }); }
const KEY_PROD = { nome:p=>p.nome.toLowerCase(), fornitore:p=>nomeForn(p).toLowerCase(), categoria:p=>p.categoria, prezzo:p=>p.ultimo_prezzo!=null?+p.ultimo_prezzo:null, costo:p=>costo(p.id)||null, iva:p=>p.iva_pct!=null?+p.iva_pct:null, data:p=>p.data_ultima_fattura||null, stato:p=>p.attivo?0:1 };
const KEY_FORN = { nome:f=>f.nome.toLowerCase(), citta:f=>(f.citta||'').toLowerCase(), pagamento:f=>(f.pagamento||'').toLowerCase(), prodotti:f=>S.prodotti.filter(p=>p.fornitore_id===f.id).length };
/* intestazione cliccabile: 'Etichetta|chiave' ; '#' davanti = colonna numerica */
function thOrd(etich, chiave, ord, act){
  const num = etich.startsWith('#'); const l = etich.replace(/^#/,'');
  if(!chiave) return `<th class="${num?'n':''}">${esc(l)}</th>`;
  const on = ord.k===chiave; const freccia = on ? (ord.d===1?' ▲':' ▼') : '';
  return `<th class="${num?'n':''}"><button class="th-ord ${on?'on':''}" data-act="${act}" data-k="${chiave}" aria-label="Ordina per ${esc(l)}">${esc(l)}${freccia}</button></th>`;
}
function tabellaOrd(cols, ord, act, rows, emptyMsg){
  if(!rows.length) return `<p class="vuoto">${emptyMsg}</p>`;
  return `<div class="tabella"><table><thead><tr>${cols.map(([e,k])=>thOrd(e,k,ord,act)).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* registra un movimento di piatto e i movimenti dei suoi ingredienti */
async function movimentoPiatto(piatto, tipo, porzioni, {da=null, a=null, motivo=null, servizio_id=null}={}){
  const mp = await insOne('movimenti_piatti', {data:ui.svData, servizio_id, piatto_id:piatto.id, tipo, porzioni, motivo, da, a});
  const tipoIngr = tipo;
  const righe = compPiatto(piatto.id).map(c=>({data:ui.svData, prodotto_id:c.prodotto_id, tipo:tipoIngr, da, a, quantita:+(+c.quantita*porzioni).toFixed(3), movimento_piatto_id:mp.id, motivo: motivo || piatto.nome}));
  if(righe.length) await ins('movimenti', righe);
}

function opzioniUmCarico(p){
  const o=[]; const c=contenuto(p); const um=umFatt(p);
  if(c && c!==1 && !['KG','KGM','L','LT'].includes(um)) o.push({v:'fatt', l:`${um||'unità'} da ${fq(p,c)}`, mul:c});
  o.push({v:'base', l:U[p.unita].big, mul:U[p.unita].mul});
  return o;
}
function calcCarico(f){
  const p = P(f.elements['prodotto_id'].value); if(!p) return null;
  const u = U[p.unita];
  const sel=f.elements['um_c']; const opz=opzioniUmCarico(p);
  if(sel.dataset.pid!==p.id){ sel.innerHTML=opz.map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join(''); sel.dataset.pid=p.id; }
  const mulC=(opz.find(o=>o.v===sel.value)||opz[0]).mul;
  const comprato = parseN(f.elements['comprato'].value)*mulC;
  const pulRaw = f.elements['pulito'].value.trim();
  const pulito = pulRaw==='' ? comprato : parseN(pulRaw)*u.mul;
  const prezzo = parseN(f.elements['prezzo'].value);
  const sfrido = comprato>0 && pulito>0 ? (1-pulito/comprato)*100 : NaN;
  const cu = pulito>0 ? prezzo/pulito : NaN;
  return {p,u,comprato,pulito,prezzo,sfrido,cu};
}

function formIngrediente(id, attr){
  return `<form id="${id}" ${attr}>
    <div class="add-row">
      <input class="cerca-box" name="cerca" list="dl-prodotti" autocomplete="off" placeholder="Cerca un prodotto…" aria-label="Cerca prodotto" required>

    </div>
    <div class="esito-cerca nota" style="margin:6px 0 0"></div>
  </form>`;
}
function righeRicetta(righe, delAct){
  let senza=0, con=0; const avvisi=[];
  const rows = righe.map(r=>{
    const p=P(r.prodotto_id); const q=+r.quantita;
    const c=q*costo(r.prodotto_id), ci=q*costoIvato(r.prodotto_id); senza+=c; con+=ci;
    if(p && !costo(r.prodotto_id)) avvisi.push(`${p.nome}: manca il prezzo${p.ultimo_prezzo!=null && !contenuto(p) ? ' (scrivi il contenuto della confezione)' : ''}`);
    else if(p && p.categoria!=='preparazione' && p.iva_pct==null) avvisi.push(`${p.nome}: manca l'IVA`);
    const cont=contenuto(p); const eq = p && cont && cont!==1 && !(['KG','KGM','L','LT'].includes(umFatt(p))) ? `<small>= ${num(q/cont,3)} ${esc(umFatt(p)||'conf.')} da ${fq(p,cont)}</small>` : '';
    return `<div class="ingr"><span class="ingr-nome">${esc(p?.nome||'?')}${eq}</span><span class="ingr-q">${fq(r.prodotto_id,q)}</span><span class="ingr-e">${eur(c)}</span><button class="x" data-act="${delAct}" data-id="${r.id}" aria-label="Togli ${esc(p?.nome||'')}">✕</button></div>`;
  });
  return {html: rows.length ? `<div class="ingr-lista">${rows.join('')}</div>` : '<p class="vuoto">Nessun ingrediente ancora: cercalo qui sotto.</p>', senza, con, avvisi};
}
function boxCosti(t, titolo, extra=''){
  return `<div class="numeri">
    <div class="numero"><span>${titolo} senza IVA</span><b>${eur(t.senza)}</b></div>
    <div class="numero forte"><span>${titolo} con IVA</span><b>${eur(t.con)}</b></div>${extra}</div>
    ${t.avvisi.length?`<div class="avviso">Costo incompleto. ${t.avvisi.map(esc).join(' · ')}</div>`:''}`;
}

/* ===== RESE ===== */
function vRese(){
  const gruppi = S.prodotti.map(p=>{
    const cs = S.carichi.filter(c=>c.prodotto_id===p.id && c.tipo==='acquisto' && c.peso_acquistato_g>0 && c.peso_pulito_g>0).sort((a,b)=>(a.data+a.created_at).localeCompare(b.data+b.created_at));
    if(!cs.length) return null;
    const sf = cs.map(c=>(1-c.peso_pulito_g/c.peso_acquistato_g)*100);
    const media = sf.reduce((a,b)=>a+b,0)/sf.length; const ultimo = sf[sf.length-1];
    return {p, n:cs.length, media, ultimo, cu:+cs[cs.length-1].costo_unitario, peggio: cs.length>1 && ultimo>media+5};
  }).filter(Boolean).sort((a,b)=>byNome(a.p,b.p));
  return `<h2 class="titolo">Rese</h2>
  <p class="intro">Quanto resta dopo pulizia e cottura, e quanto costa davvero quello che finisce nel piatto.</p>
  ${det('re-calc','Calcolatrice', `
    <form id="f-resa" class="griglia" onsubmit="return false">
      <label>Prezzo pagato (€)<input name="prezzo" inputmode="decimal" value="20"></label>
      <label>Peso comprato (kg)<input name="comprato" inputmode="decimal" value="1"></label>
      <label>Peso dopo la pulizia (kg)<input name="pulito" inputmode="decimal" value="0,6"></label>
      <label>Peso dopo la cottura (kg, se serve)<input name="cotto" inputmode="decimal"></label>
      <label>Grammi nel piatto<input name="porzione" inputmode="decimal" value="100"></label>
    </form>
    <div id="resa-calc"></div>
    <p class="nota">Esempio: compri 1 kg di pesce a 20 €, pulito ne restano 600 g. Quei 600 g costano 20 €: il costo vero è 33,33 € al kg, non 20 €.</p>`)}
  ${det('re-storico','Rese dei carichi, prodotto per prodotto', tabella(['Prodotto','#Carichi','#Sfrido medio','#Ultimo sfrido','#Ultimo costo vero',''],
    gruppi.map(g=>`<tr>${td(esc(g.p.nome))}${td(g.n,1)}${td(pct(g.media),1)}${td(pct(g.ultimo),1)}${td(fc(g.p,g.cu),1)}${td(g.peggio?'<span class="chip rosso">resa peggiorata</span>':'')}</tr>`),
    'Nessun carico con pesi ancora.'))}
  <p class="nota">«Resa peggiorata» compare quando l'ultimo carico ha più di 5 punti di sfrido rispetto alla media: vale la pena parlarne con il fornitore.</p>`;
}
function aggiornaCalcolatrice(){
  const f=$('#f-resa'); if(!f) return;
  const g = n => parseN(f.elements[n].value);
  const prezzo=g('prezzo'), comp=g('comprato'), pul=g('pulito'), cot=g('cotto'), gp=g('porzione');
  const fin = cot>0 ? cot : pul;
  const sfr = comp>0&&pul>0 ? (1-pul/comp)*100 : NaN;
  const calo = pul>0&&cot>0 ? (1-cot/pul)*100 : NaN;
  const kgPul = pul>0 ? prezzo/pul : NaN, kgFin = fin>0 ? prezzo/fin : NaN;
  const crudo = fin>0&&comp>0&&gp>0 ? gp*comp/fin : NaN;
  const cPorz = kgFin>0&&gp>0 ? kgFin*gp/1000 : NaN;
  $('#resa-calc').innerHTML = `<div class="calc">
    <div><span>Sfrido (pulizia)</span><b>${pct(sfr)}</b></div>
    <div><span>Calo in cottura</span><b>${pct(calo)}</b></div>
    <div><span>Costo vero al kg pulito</span><b>${isFinite(kgPul)?eur(kgPul):'—'}</b></div>
    <div><span>Costo vero al kg ${cot>0?'cotto':'pulito'}</span><b>${isFinite(kgFin)?eur(kgFin):'—'}</b></div>
    <div><span>Crudo da comprare per ${num(gp,0)} g nel piatto</span><b>${isFinite(crudo)?num(crudo,0)+' g':'—'}</b></div>
    <div><span>Costo della porzione</span><b>${isFinite(cPorz)?eur(cPorz):'—'}</b></div></div>`;
}

/* ===== CONTROLLO ===== */
function vControllo(){
  const da=ui.coDa, a=ui.coA;
  const inP = d => d>=da && d<=a;
  const iniziale = valore(addDays(da,-1)), finale = valore(a);
  const comprato = S.carichi.filter(c=>c.tipo==='acquisto' && inP(c.data) && isFood(P(c.prodotto_id))).reduce((s,c)=>s + +c.prezzo, 0);
  const nf = p => p && NON_FOOD.has(p.categoria);
  const nfIni = valore(addDays(da,-1), nf), nfFin = valore(a, nf);
  const nfComp = S.carichi.filter(c=>c.tipo==='acquisto' && inP(c.data) && nf(P(c.prodotto_id))).reduce((s,c)=>s + +c.prezzo, 0);
  const nfUsato = nfIni + nfComp - nfFin;
  const nfPerCat = ['pulizia','materiali'].map(cat=>{ const f=p=>p&&p.categoria===cat; const i=valore(addDays(da,-1),f), fi=valore(a,f), c=S.carichi.filter(x=>x.tipo==='acquisto'&&inP(x.data)&&f(P(x.prodotto_id))).reduce((s,x)=>s + +x.prezzo,0); return {cat, i, c, fi, u:i+c-fi}; });
  const usato = iniziale + comprato - finale;
  const mpP = S.mpiatti_mov.filter(m=>inP(m.data));
  const vendutiP = mpP.filter(m=>m.tipo==='venduto' || m.tipo==='surplus');
  const teorico = vendutiP.reduce((s,m)=>s + +m.porzioni*costoPiatto(m.piatto_id), 0);
  const movP = S.movimenti.filter(m=>inP(m.data) && isFood(P(m.prodotto_id)));
  const eurMov = m => +m.quantita*costo(m.prodotto_id);
  const scarti = movP.filter(m=>m.tipo==='scarto'), pasti = movP.filter(m=>m.tipo==='pasto_personale');
  const ammanchi = movP.filter(m=>m.tipo==='rettifica' && m.da), trovati = movP.filter(m=>m.tipo==='rettifica' && m.a);
  const sScarti = scarti.reduce((s,m)=>s+eurMov(m),0), sPasti = pasti.reduce((s,m)=>s+eurMov(m),0);
  const spiegato = teorico + sScarti + sPasti;
  const nonSpiegato = usato - spiegato;
  const surplus = mpP.filter(m=>m.tipo==='surplus');
  const incasso = parseN(ui.incasso);
  const ogni100 = x => incasso>0 ? eur(x/incasso*100) : '—';
  const nomeRiga = m => m.movimento_piatto_id ? `${esc(P(m.prodotto_id)?.nome||'?')} <small style="color:var(--grigio)">(${esc(PI(S.mpiatti_mov.find(x=>x.id===m.movimento_piatto_id)?.piatto_id)?.nome||'piatto')})</small>` : esc(P(m.prodotto_id)?.nome||'?');

  return `<h2 class="titolo">Controllo</h2>
  <p class="intro">Il conto della merce, come a scuola: c'era + comprato − rimasto = usato.</p>
  <div class="riga" style="margin-bottom:12px">
    <label>Dal<input type="date" id="co-da" value="${da}"></label>
    <label>Al<input type="date" id="co-a" value="${a}"></label>
    <button class="btn sec" data-act="co-settimana">Questa settimana</button>
    <button class="btn sec" data-act="co-mese">Questo mese</button>
  </div>
  ${det('co-sintesi','Il conto della merce', `
    <div class="equazione">
      <div class="blocco"><small>C'era</small><b>${eur(iniziale)}</b></div><span class="op">+</span>
      <div class="blocco"><small>Comprato</small><b>${eur(comprato)}</b></div><span class="op">−</span>
      <div class="blocco"><small>Rimasto</small><b>${eur(finale)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Usato</small><b>${eur(usato)}</b></div>
    </div>
    <div class="equazione">
      <div class="blocco"><small>Serviva per i piatti venduti</small><b>${eur(teorico)}</b></div><span class="op">+</span>
      <div class="blocco"><small>Scarti segnati</small><b>${eur(sScarti)}</b></div><span class="op">+</span>
      <div class="blocco"><small>Pasto personale</small><b>${eur(sPasti)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Uso spiegato</small><b>${eur(spiegato)}</b></div>
    </div>
    <div class="equazione">
      <div class="blocco fine"><small>Usato</small><b>${eur(usato)}</b></div><span class="op">−</span>
      <div class="blocco fine"><small>Uso spiegato</small><b>${eur(spiegato)}</b></div><span class="op">=</span>
      <div class="blocco ${nonSpiegato>0.5?'allarme':'fine'}"><small>Non spiegato</small><b>${eur(nonSpiegato)}</b></div>
    </div>
    <p class="nota">«Non spiegato» è la merce uscita senza un piatto venduto o uno scarto segnato. Se è alto, si guarda insieme dove nasce: conte, grammature fuori scheda, scarti non segnati.</p>
    <div class="riga" style="margin-top:14px"><label>Incasso della cucina nel periodo (€, IVA esclusa)<input id="co-incasso" inputmode="decimal" value="${esc(ui.incasso)}" placeholder="facoltativo"></label></div>
    ${incasso>0?`<div class="calc">
      <div><span>Merce usata ogni 100 € incassati</span><b>${ogni100(usato)}</b></div>
      <div><span>Secondo le schede</span><b>${ogni100(teorico)}</b></div>
      <div><span>Differenza ogni 100 €</span><b>${ogni100(usato-teorico)}</b></div></div>`:''}
    <p class="nota">I valori usano l'ultimo costo vero di ogni prodotto. Il conto è preciso solo se all'inizio e alla fine del periodo il magazzino è stato contato.</p>`)}

  ${det('co-nonfood','Pulizia e materiali di consumo', `
    <p class="nota" style="margin-top:12px">Non sono cibo: stanno fuori dal food cost. Si contano a fine mese e l'app calcola quanto è stato usato.</p>
    <div class="equazione">
      <div class="blocco"><small>C'era</small><b>${eur(nfIni)}</b></div><span class="op">+</span>
      <div class="blocco"><small>Comprato</small><b>${eur(nfComp)}</b></div><span class="op">−</span>
      <div class="blocco"><small>Rimasto</small><b>${eur(nfFin)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Usato</small><b>${eur(nfUsato)}</b></div>
    </div>
    ${tabella(['Famiglia','#C\'era','#Comprato','#Rimasto','#Usato'], nfPerCat.map(r=>`<tr>${td(r.cat)}${td(eur(r.i),1)}${td(eur(r.c),1)}${td(eur(r.fi),1)}${td('<b>'+eur(r.u)+'</b>',1)}</tr>`))}
    ${(()=>{ const vp=S.mpiatti_mov.filter(m=>inP(m.data)&&(m.tipo==='venduto'||m.tipo==='surplus')).reduce((s,m)=>s + +m.porzioni,0); return vp>0?`<div class="calc"><div><span>Pulizia e materiali per piatto venduto</span><b>${eur(nfUsato/vp)}</b></div></div>`:''; })()}`)}

  ${det('co-surplus','Venduti più di quelli in linea (surplus)', tabella(['Giorno','Piatto','#Porzioni','#Valore'],
    surplus.map(m=>`<tr>${td(dataIt(m.data))}${td(esc(PI(m.piatto_id)?.nome||'?'))}${td(num(m.porzioni),1)}${td(eur(+m.porzioni*costoPiatto(m.piatto_id)),1)}</tr>`), 'Nessun surplus nel periodo.'), surplus.length?surplus.length+' volte':'')}

  ${det('co-conta','Differenze alla conta', tabella(['Giorno','Prodotto','Dove','Differenza','#Valore'],
    [...ammanchi.map(m=>`<tr>${td(dataIt(m.data))}${td(esc(P(m.prodotto_id)?.nome||'?'))}${td(m.da)}${td(`<span class="neg">mancano ${fq(m.prodotto_id,+m.quantita)}</span>`)}${td(`<span class="neg">−${eur(eurMov(m))}</span>`,1)}</tr>`),
     ...trovati.map(m=>`<tr>${td(dataIt(m.data))}${td(esc(P(m.prodotto_id)?.nome||'?'))}${td(m.a)}${td(`in più ${fq(m.prodotto_id,+m.quantita)}`)}${td('+'+eur(eurMov(m)),1)}</tr>`)],
    'Nessuna differenza nel periodo.'))}

  ${det('co-scarti','Scarti e pasti del personale', tabella(['Giorno','Ingrediente','Cosa','#Quantità','Motivo','#Valore'],
    [...scarti,...pasti].sort((x,y)=>y.data.localeCompare(x.data)).map(m=>`<tr>${td(dataIt(m.data))}${td(nomeRiga(m))}${td(esc(TIPI_MOV[m.tipo]))}${td(fq(m.prodotto_id,+m.quantita),1)}${td(esc(m.motivo||''))}${td(eur(eurMov(m)),1)}</tr>`),
    'Niente nel periodo.'))}`;
}

function esitoCerca(f){
  const box=f.querySelector('.esito-cerca'); const p=trovaProdotto(f.elements['cerca'].value, f.dataset.prep);
  if(!p){ box.textContent = f.elements['cerca'].value.trim() ? 'Nessun prodotto trovato: continua a scrivere o scegli dall\'elenco.' : ''; return; }
  const ok=UM_PER[p.unita]; const sel=f.elements['um'];
  if(!ok.includes(sel.value)) sel.value = ok[0];
  [...sel.options].forEach(o=>o.disabled = !ok.includes(o.value));
  box.innerHTML = `Trovato: <b>${esc(p.nome)}</b> · si misura in ${ok.join(' o ')}${descrUnitaFattura(p)?' · in fattura: '+esc(descrUnitaFattura(p))+(p.ultimo_prezzo!=null?' a '+eur(+p.ultimo_prezzo):''):''} · costo ${costo(p.id)?fc(p,costo(p.id)):'non ancora noto'}${p.iva_pct!=null?' · IVA '+num(p.iva_pct,0)+'%':''}`;
}

document.addEventListener('submit', async e=>{
  const f=e.target; if(!f.id) return; e.preventDefault();
  const v = n => f.elements[n]?.value ?? '';
  const nOrNull = x => { const s=String(v(x)).trim(); return s==='' ? null : parseN(s); };
  switch(f.id){
    case 'f-login': {
      busy(true);
      const {error} = await sb.auth.signInWithPassword({email:v('email'), password:v('password')});
      busy(false);
      if(error) renderLogin('Email o password non corretti.');
      break;
    }
    case 'f-porta': {
      const p=PI(v('piatto_id')); const n=Math.round(parseN(v('porzioni')));
      if(!p || n<=0) return toast('Scegli il piatto e le porzioni.','err');
      if(!compPiatto(p.id).length) return toast('Questo piatto non ha la scheda: aggiungi gli ingredienti.','err');
      run(async ()=>{ const sv=await ensureServizio(); await movimentoPiatto(p,'in_linea',n,{da:'magazzino',a:'linea',servizio_id:sv.id}); }, `${p.nome}: ${n} porzioni in linea`);
      break;
    }
    case 'f-vendite': {
      const qty = S.piatti.map(p=>({p, q:Math.round(parseN(f.elements['q_'+p.id]?.value))})).filter(x=>x.q>0);
      if(!qty.length) return toast('Scrivi almeno un piatto venduto.','err');
      run(async ()=>{
        const sv = await ensureServizio(); let surplus=[];
        for(const {p,q} of qty){
          const lin = Math.max(porzioniLinea(p.id), 0);
          const daLinea = Math.min(q, lin), resto = q - daLinea;
          if(daLinea>0) await movimentoPiatto(p,'venduto',daLinea,{da:'linea',servizio_id:sv.id});
          if(resto>0){ surplus.push(`${p.nome} +${resto}`); await movimentoPiatto(p,'surplus',resto,{da:'magazzino',servizio_id:sv.id,motivo:'venduti più di quelli in linea'}); }
        }
        await upd('servizi', sv.id, {chiuso:true});
        if(surplus.length) setTimeout(()=>toast('Vendite registrate. Surplus dal magazzino: '+surplus.join(', ')), 60);
      }, 'Vendite registrate');
      break;
    }
    case 'f-rientro': {
      const p=PI(v('piatto_id')); const n=Math.round(parseN(v('porzioni')));
      if(!p || n<=0) return toast('Scegli il piatto e le porzioni.','err');
      if(n>porzioniLinea(p.id)) return toast('In linea non ci sono tante porzioni.','err');
      run(()=>movimentoPiatto(p,'rientro',n,{da:'linea',a:'magazzino'}), 'Rimesso in magazzino');
      break;
    }
    case 'f-scarto-piatto': {
      const p=PI(v('piatto_id')); const n=parseN(v('porzioni'));
      if(!p || n<=0) return toast('Scegli il piatto e le porzioni.','err');
      const tipo=v('tipo'), daDove=v('da');
      if(tipo==='scarto' && !v('motivo').trim()) return toast('Per uno scarto serve il motivo.','err');
      if(daDove==='linea' && n>porzioniLinea(p.id)) return toast('In linea non ci sono tante porzioni.','err');
      run(()=>movimentoPiatto(p,tipo,n,{da:daDove,motivo:v('motivo').trim()||null}), 'Segnato');
      break;
    }
    case 'f-scarto-ingr': {
      const q=parseN(v('quantita')); if(q<=0) return toast('Scrivi la quantità.','err');
      if(v('tipo')==='scarto' && !v('motivo').trim()) return toast('Per uno scarto serve il motivo.','err');
      run(()=>ins('movimenti',{data:ui.svData, prodotto_id:v('prodotto_id'), tipo:v('tipo'), da:v('da'), quantita:q, motivo:v('motivo').trim()||null}), 'Segnato');
      break;
    }
    case 'f-carico': {
      const r = calcCarico(f); if(!r) return toast('Scegli il prodotto.','err');
      if(r.pulito<=0 || r.comprato<=0) return toast('Scrivi la quantità comprata.','err');
      if(r.pulito>r.comprato) return toast('La quantità pulita non può superare quella comprata.','err');
      const cont=contenuto(r.p);
      const prezzoUnit = cont ? r.prezzo/(r.comprato/cont) : null;
      run(async ()=>{
        await ins('carichi',{data:v('data'), prodotto_id:r.p.id, fornitore:v('fornitore').trim()||nomeForn(r.p)||null, peso_acquistato_g:r.comprato, prezzo:r.prezzo, peso_pulito_g:r.pulito, quantita:r.pulito, costo_unitario:+(r.prezzo/r.pulito).toFixed(6), tipo:'acquisto', note:v('note').trim()||null});
        const agg = {data_ultima_fattura:v('data')}; if(prezzoUnit!=null){ agg.ultimo_prezzo=+prezzoUnit.toFixed(4); agg.ultima_quantita=+(r.comprato/cont).toFixed(3); }
        await upd('prodotti', r.p.id, agg);
      }, `Caricato: ${fq(r.p,r.pulito)} di ${r.p.nome}`);
      break;
    }
    case 'f-produzione': {
      const p=P(v('prep_id')); if(!p) return;
      const lotti=parseN(v('lotti')); if(lotti<=0) return toast('Scrivi quanti lotti.','err');
      const righe=S.prep.filter(r=>r.prep_id===p.id); if(!righe.length) return toast('Manca la ricetta della preparazione.','err');
      const ott = parseN(v('ottenuto')) || (+p.resa_quantita||0)*lotti; if(ott<=0) return toast('Scrivi quanto è venuto.','err');
      const costoTot = costoLotto(p.id)*lotti; const oggi = localISO();
      run(async ()=>{
        await ins('movimenti', righe.map(r=>({data:oggi, prodotto_id:r.prodotto_id, tipo:'uso_produzione', da:'magazzino', quantita:+(+r.quantita*lotti).toFixed(3), motivo:'per '+p.nome})));
        await ins('carichi', {data:oggi, prodotto_id:p.id, prezzo:+costoTot.toFixed(2), quantita:ott, costo_unitario:+(costoTot/ott).toFixed(6), tipo:'produzione'});
      }, `Prodotti ${fq(p,ott)} di ${p.nome}`);
      break;
    }
    case 'f-conta': {
      const data=v('data')||localISO(); const mov=[];
      for(const p of S.prodotti){
        const st=stock(p.id), mul=U[p.unita].mul;
        for(const [k,posto,att] of [['m_','magazzino',st.mag],['l_','linea',st.lin]]){
          const raw=f.elements[k+p.id]?.value; if(raw==null || raw.trim()==='') continue;
          const diff = parseN(raw)*mul - att; if(Math.abs(diff)<0.5) continue;
          mov.push(diff>0 ? {data, prodotto_id:p.id, tipo:'rettifica', a:posto, quantita:+diff.toFixed(3), motivo:'conta: trovato in più'}
                          : {data, prodotto_id:p.id, tipo:'rettifica', da:posto, quantita:+(-diff).toFixed(3), motivo:'conta: manca'});
        }
      }
      if(!mov.length) return toast('Nessuna differenza: i conti tornano.');
      run(()=>ins('movimenti', mov), `Conta salvata: ${mov.length} differenz${mov.length===1?'a':'e'} registrat${mov.length===1?'a':'e'}`);
      break;
    }
    case 'f-prodotto': {
      const fid = v('fornitore_id')||null;
      const row = {nome:v('nome').trim(), categoria:v('categoria'), unita:v('unita'), fornitore_id:fid, fornitore: fid ? F(fid)?.nome : null, confezione:v('confezione').trim()||null, um_acquisto:v('um_acquisto').trim().toUpperCase()||null, contenuto_conf:nOrNull('contenuto_conf'), ultimo_prezzo:nOrNull('ultimo_prezzo'), iva_pct:nOrNull('iva_pct'), ultima_quantita:nOrNull('ultima_quantita'), resa_quantita:nOrNull('resa_quantita'), note:v('note').trim()||null};
      if(!row.nome) return toast('Serve il nome.','err');
      const id=f.dataset.id;
      run(async ()=>{
        if(id==='new'){ const d=await insOne('prodotti', row); ui.editProdotto = row.categoria==='preparazione' ? d.id : null; }
        else await upd('prodotti', id, row);
      }, 'Prodotto salvato');
      break;
    }
    case 'f-fornitore': {
      const row={nome:v('nome').trim(), partita_iva:v('partita_iva').trim()||null, citta:v('citta').trim()||null, pagamento:v('pagamento').trim()||null, telefono:v('telefono').trim()||null, note:v('note').trim()||null};
      if(!row.nome) return toast('Serve il nome.','err');
      const id=f.dataset.id;
      run(async ()=>{ if(id==='new') await ins('fornitori', row); else await upd('fornitori', id, row); ui.editFornitore=null; }, 'Fornitore salvato');
      break;
    }
    case 'f-prepcomp':
    case 'f-pcomp': {
      const p=trovaProdotto(v('cerca'), f.dataset.prep); if(!p) return toast('Prodotto non trovato: sceglilo dall\'elenco.','err');
      const q=parseN(v('quantita')); if(q<=0) return toast('Scrivi la quantità.','err');
      const [base,fatt]=UM[v('um')]; if(base!==p.unita) return toast(`${p.nome} si misura in ${UM_PER[p.unita].join(' o ')}.`,'err');
      const qb=+(q*fatt).toFixed(3);
      run(()=> f.id==='f-pcomp' ? ins('piatto_componenti',{piatto_id:f.dataset.piatto, prodotto_id:p.id, quantita:qb}) : ins('prep_componenti',{prep_id:f.dataset.prep, prodotto_id:p.id, quantita:qb}), `Aggiunto: ${p.nome}`);
      break;
    }
    case 'f-piatto': {
      const row={nome:v('nome').trim(), portata:v('portata'), note:v('note').trim()||null}; if(!row.nome) return toast('Serve il nome.','err');
      const id=f.dataset.id;
      run(async ()=>{ if(id==='new'){ const d=await insOne('piatti', row); ui.editPiatto=d.id; } else await upd('piatti', id, row); }, 'Piatto salvato');
      break;
    }
    case 'f-menu': {
      const row={nome:v('nome').trim(), prezzo:parseN(v('prezzo'))}; if(!row.nome) return toast('Serve il nome.','err');
      const scelti=[...f.querySelectorAll('input[name=piatto]:checked')].map(x=>x.value);
      const id=f.dataset.id;
      run(async ()=>{
        let mid=id;
        if(id==='new'){ mid=(await insOne('menu', row)).id; }
        else { await upd('menu', id, row); const {error}=await sb.from('menu_piatti').delete().eq('menu_id', id); if(error) throw error; }
        if(scelti.length) await ins('menu_piatti', scelti.map((pid,i)=>({menu_id:mid, piatto_id:pid, ordine:i})));
        ui.editMenu=null;
      }, 'Menu salvato');
      break;
    }
  }
});

/* ===== Avvio ===== */
sb.auth.onAuthStateChange(async (_ev, session)=>{
  const nuovo = session?.user || null;
  if(nuovo && (!ui.user || ui.user.id!==nuovo.id)){
    ui.user = nuovo;
    try{ busy(true); await loadAll(); }catch(e){ toast('Errore nel caricare i dati: '+e.message,'err'); } finally{ busy(false); }
    render();
  } else if(!nuovo){ ui.user=null; renderLogin(); }
});
renderLogin();
</script>
