<script>

const S = {fornitori:[],prodotti:[],prep:[],carichi:[],movimenti:[],mpiatti_mov:[],servizi:[],piatti:[],pcomp:[],menu:[],mpiatti:[],conte:[],crighe:[],abbina:[],rapporti:[]};
const TAB = {fornitori:'fornitori',prodotti:'prodotti',prep:'prep_componenti',carichi:'carichi',movimenti:'movimenti',mpiatti_mov:'movimenti_piatti',servizi:'servizi',piatti:'piatti',pcomp:'piatto_componenti',menu:'menu',mpiatti:'menu_piatti',conte:'conte',crighe:'conte_righe',abbina:'cassa_abbinamenti',rapporti:'cassa_rapporti'};
const CAT_CUCINA = ['pesce','crostacei','carne','pasta','verdura','frutta','latticini','dispensa','pane','preparazione','pulizia','materiali','altro'];
const CAT_SALA = ['bollicine','vino bianco','vino rosato','vino rosso','vino dolce','acqua','bibite','birra','distillati e amari','caffè e tè','pane e coperto','tovagliato','materiali','pulizia','altro'];

const SALA = () => REP==='sala';
const isFood = p => p && !NON_FOOD.has(p.categoria);

let PORTATE = POR_CUCINA;
const FAM_DA_CAT = {'bollicine':'vino in bottiglia','vino bianco':'vino in bottiglia','vino rosato':'vino in bottiglia','vino rosso':'vino in bottiglia','vino dolce':'vino in bottiglia','acqua':'acqua','bibite':'bibite e birre','birra':'bibite e birre','distillati e amari':'distillati e amari','caffè e tè':'caffetteria'};
const U = {g:{big:'kg',mul:1000,small:'g',nome:'grammi'}, ml:{big:'litri',mul:1000,small:'ml',nome:'millilitri'}, pz:{big:'pezzi',mul:1,small:'pz',nome:'pezzi'}};

function trovaProdotto(testo, escludi){
  const t=String(testo||'').trim().toLowerCase(); if(!t) return null;
  const att=S.prodotti.filter(p=>p.attivo && p.id!==escludi && isFood(p));
  return att.find(p=>p.nome.toLowerCase()===t) || (x=>x.length===1?x[0]:null)(att.filter(p=>p.nome.toLowerCase().includes(t)));
}
/* quanti g / ml / pz ci sono in 1 unita della fattura */
function contenuto(p){
  if(!p) return null;
  if(+p.contenuto_conf>0) return +p.contenuto_conf;
  const um=(p.um_acquisto||'').toUpperCase();
  if(p.unita==='g' && (um==='KG'||um==='KGM')) return 1000;
  if(p.unita==='g' && (um==='G'||um==='GR')) return 1;
  if(p.unita==='ml' && (um==='L'||um==='LT')) return 1000;
  if(p.unita==='ml' && um==='ML') return 1;
  const m=String(p.confezione||'').toLowerCase().replace(',','.').match(/(\d+(?:\.\d+)?)\s*(kg|gr|g|lt|l|cl|ml)\b/);
  if(m){ const n=+m[1], u=m[2];
    if(p.unita==='g'){ if(u==='kg') return n*1000; if(u==='g'||u==='gr') return n; }
    if(p.unita==='ml'){ if(u==='l'||u==='lt') return n*1000; if(u==='cl') return n*10; if(u==='ml') return n; } }
  if(p.unita==='pz' && (um==='PZ'||um==='NR'||um==='PCE')) return 1;
  return null;
}
const umFatt = p => (p.um_acquisto||'').toUpperCase();
function descrUnitaFattura(p){ const c=contenuto(p); if(!c) return ''; return `${umFatt(p)||'unità'} da ${fq(p,c)}`; }

/* quantita in unita base (g, ml, pz) scritta in modo leggibile */
function fq(pid, q){
  const p = typeof pid==='object' ? pid : P(pid); if(!p) return num(q);
  const u = U[p.unita]; const neg = q<0 ? '−' : ''; const a = Math.abs(q);
  if(isBott(p)) return neg+num(a/+p.contenuto_conf,2)+' bott.';
  if(p.unita==='pz'){
    /* quello che si compra a casse o confezioni si legge a casse; sotto le 6 casse, a pezzi */
    const c = +p.contenuto_conf; 
    if(p.reparto==='sala' && c>1 && a/c>=6){ const u=unitaOrdine(p); const n=Math.floor(a/c), r=Math.round(a-n*c);
      return neg+num(n,0)+' '+(n===1?u.sing:u.plur)+(r?' + '+num(r,0)+' pz':''); }
    return neg+num(a,1)+' pz';
  }
  return a>=1000 ? neg+num(a/1000,2)+' '+(p.unita==='g'?'kg':'L') : neg+num(a,0)+' '+u.small;
}

/* ===== Calcoli ===== */
function stock(pid, upTo){
  let mag=0, lin=0;
  for(const c of S.carichi) if(c.prodotto_id===pid && (!upTo || c.data<=upTo)) mag += +c.quantita;
  for(const m of S.movimenti) if(m.prodotto_id===pid && (!upTo || m.data<=upTo)){
    const q = +m.quantita;
    if(m.a==='magazzino') mag+=q; if(m.a==='linea') lin+=q;
    if(m.da==='magazzino') mag-=q; if(m.da==='linea') lin-=q;
  }
  return {mag, lin};
}
/* € per unita base: ultimo carico, oppure dalla ricetta se e una preparazione */
function costo(pid, seen=new Set()){
  const cs = S.carichi.filter(c=>c.prodotto_id===pid && +c.quantita>0)
    .sort((a,b)=> (b.data+b.created_at).localeCompare(a.data+a.created_at));
  if(cs.length) return +cs[0].costo_unitario;
  const p = P(pid); if(!p) return 0;
  if(p.categoria==='preparazione' && !seen.has(pid)){ seen.add(pid); const r=+p.resa_quantita||0; return r ? costoLotto(pid, seen)/r : 0; }
  /* nessun carico: dall'ultimo prezzo di fattura diviso il contenuto della confezione */
  const c=contenuto(p);
  if(p.ultimo_prezzo!=null && c) return +p.ultimo_prezzo/c;
  return 0;
}
/* quota IVA di un prodotto (0,10 = 10%); per le preparazioni si ricava dagli ingredienti */
function ivaEff(pid, seen=new Set()){
  const p=P(pid); if(!p) return 0;
  if(p.categoria==='preparazione' && !seen.has(pid)){ seen.add(pid); const base=costoLotto(pid,new Set(seen)); return base>0 ? costoLottoIva(pid,new Set(seen))/base - 1 : 0; }
  return (+p.iva_pct||0)/100;
}
const costoIvato = (pid, seen=new Set()) => costo(pid, new Set(seen))*(1+ivaEff(pid, new Set(seen)));
function costoLottoIva(pid, seen=new Set()){ return S.prep.filter(r=>r.prep_id===pid).reduce((s,r)=>s + +r.quantita*costoIvato(r.prodotto_id, seen), 0); }
function costoLotto(pid, seen=new Set()){ return S.prep.filter(r=>r.prep_id===pid).reduce((s,r)=>s + +r.quantita*costo(r.prodotto_id, new Set(seen)), 0); }
const compPiatto = id => S.pcomp.filter(c=>c.piatto_id===id);
function costoPiatto(id){ return compPiatto(id).reduce((s,c)=>s + +c.quantita*costo(c.prodotto_id), 0); }
function costoPiattoIva(id){ return compPiatto(id).reduce((s,c)=>s + +c.quantita*costoIvato(c.prodotto_id), 0); }
function costoMenuIva(id){ return S.mpiatti.filter(x=>x.menu_id===id).reduce((s,x)=>s + costoPiattoIva(x.piatto_id), 0); }
function costoMenu(id){ return S.mpiatti.filter(x=>x.menu_id===id).reduce((s,x)=>s + costoPiatto(x.piatto_id), 0); }
function valore(upTo, filtro=isFood){ return S.prodotti.filter(filtro).reduce((s,p)=>{ const st=stock(p.id, upTo); return s + (st.mag+st.lin)*costo(p.id); }, 0); }
/* porzioni di un piatto oggi in linea */
function porzioniLinea(piattoId){
  let n=0;
  for(const m of S.mpiatti_mov) if(m.piatto_id===piattoId){
    const q=+m.porzioni;
    if(m.a==='linea') n+=q;
    if(m.da==='linea') n-=q;
  }
  return n;
}
/* quante porzioni si possono fare con quello che c'e in magazzino */
function porzioniPossibili(piattoId){
  const cc = compPiatto(piattoId); if(!cc.length) return null;
  return Math.max(0, Math.min(...cc.map(c=>Math.floor(stock(c.prodotto_id).mag / +c.quantita + 1e-9))));
}

/* ultimo giorno in cui un prodotto è stato contato (conte registrate + vecchie differenze alla conta) */
let _ultimaConta = null;
function ultimaConta(pid){
  if(!_ultimaConta){
    _ultimaConta = new Map(); const dataConta = new Map(S.conte.map(c=>[c.id, c.data]));
    const segna = (id,d) => { if(d && (!_ultimaConta.has(id) || _ultimaConta.get(id)<d)) _ultimaConta.set(id,d); };
    for(const r of S.crighe) segna(r.prodotto_id, dataConta.get(r.conta_id));
    for(const m of S.movimenti) if(m.tipo==='rettifica' && /^conta/.test(m.motivo||'')) segna(m.prodotto_id, m.data);
  }
  return _ultimaConta.get(pid) || null;
}
const giorniDa = iso => iso ? Math.round((new Date(localISO()+'T12:00:00') - new Date(iso+'T12:00:00'))/864e5) : null;
/* comprato e usato nel periodo, prodotto per prodotto (valori all'ultimo costo vero, il comprato al prezzo pagato) */
function confronto(da, a){
  const inP = d => d>=da && d<=a; const prima = addDays(da,-1);
  const USO = new Set(['venduto','surplus','uso_produzione']), PERSO = new Set(['scarto','pasto_personale','omaggio','reso']);
  const out = [];
  for(const p of S.prodotti.filter(isFood)){
    const c = costo(p.id); const prep = p.categoria==='preparazione';
    let qComp=0, eComp=0, qUso=0, qPerso=0, qManca=0;
    for(const k of S.carichi) if(k.prodotto_id===p.id && inP(k.data)){ qComp += +k.quantita; eComp += +k.prezzo; }
    for(const m of S.movimenti) if(m.prodotto_id===p.id && inP(m.data)){
      const q=+m.quantita;
      if(USO.has(m.tipo)) qUso+=q; else if(PERSO.has(m.tipo)) qPerso+=q;
      else if(m.tipo==='rettifica') qManca += m.da ? q : -q;
    }
    const i=stock(p.id,prima), f=stock(p.id,a); const qVar=(f.mag+f.lin)-(i.mag+i.lin);
    if(!qComp && !qUso && !qPerso && Math.abs(qManca)<0.5 && Math.abs(qVar)<0.5) continue;
    const eUso=qUso*c, ePerso=qPerso*c, eManca=qManca*c, eVar=qVar*c;
    out.push({p, prep, c, qComp, eComp, qUso, eUso, qPerso, ePerso, qManca, eManca, qVar, eVar,
      daGiust: eComp - eUso - ePerso, ultima: ultimaConta(p.id)});
  }
  return out;
}

/* ordinamento di qualsiasi tabella cliccando sul titolo della colonna */
const MESI = {gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12};
function chiaveCella(cell){
  if(!cell) return {t:2,v:''};
  if(cell.dataset.v!=null) return {t:0,v:+cell.dataset.v};
  const txt = cell.textContent.replace(/\s+/g,' ').trim();
  const d = txt.match(/\b(\d{1,2}) (gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic)\b/i);
  if(d) return {t:0, v:MESI[d[2].toLowerCase()]*100 + +d[1]};
  const m = txt.replace(/−/g,'-').match(/-?\d[\d.]*(,\d+)?/);
  if(m && /^[-−]?[\d.,]+/.test(txt.replace(/^(mancano|in più|\+)\s*/,''))){
    let n = parseFloat(m[0].replace(/\./g,'').replace(',','.'));
    if(/\d\s*(kg|L)\b/.test(txt)) n *= 1000;
    return {t:0, v:n};
  }
  return {t:1, v:txt.toLowerCase()};
}
function ordinaTabella(th){
  const table = th.closest('table'); const col = +th.dataset.col; const tb = table.tBodies[0];

    return (x.t===0 ? x.v-y.v : String(x.v).localeCompare(String(y.v),'it',{numeric:true}))*dir; });

}

/* tovagliato: ogni coperto usa i pezzi scritti nel prodotto (es. 1 tovagliolo). Si riscrive a ogni salvataggio dei coperti */
async function scaricaTovagliato(sv, coperti){
  const {error} = await sb.from('movimenti').delete().eq('servizio_id', sv.id).eq('tipo','coperti'); if(error) throw error;
  if(!(coperti>0)) return;
  const righe = S.prodotti.filter(p=>p.attivo && +p.pezzi_per_coperto>0)
    .map(p=>({data:sv.data, prodotto_id:p.id, tipo:'coperti', da:'magazzino', quantita:+(coperti * +p.pezzi_per_coperto).toFixed(2), servizio_id:sv.id, motivo:`${coperti} coperti`}));
  if(righe.length) await ins('movimenti', righe);
}

const GIORNI_ALLARME = () => SALA() ? 7 : 3;   /* avvisa quando restano meno di questi giorni */
const TIPI_USCITA = new Set(['venduto','surplus','uso_produzione','scarto','pasto_personale','omaggio','coperti']);
function consumoGiorno(pid, giorni=14){
  const da = addDays(localISO(), -giorni);
  return S.movimenti.filter(m=>m.prodotto_id===pid && TIPI_USCITA.has(m.tipo) && m.data>da).reduce((s,m)=>s + +m.quantita,0) / giorni;
}
function allarmiScorta(){
  const out = [];
  for(const p of S.prodotti.filter(p=>p.attivo && p.categoria!=='preparazione')){
    const st = stock(p.id); const q = st.mag + st.lin; const c = consumoGiorno(p.id); const min = p.scorta_minima!=null ? +p.scorta_minima : null;
    const giorni = c>0 ? q/c : null;
    let perche = null, gravita = 0;
    if(q<=0.5 && (c>0 || min!=null)){ perche = 'finito'; gravita = 3; }
    else if(min!=null && q<=min){ perche = 'sotto scorta (min '+fq(p,min)+')'; gravita = 2; }
    else if(min==null && giorni!=null && giorni<=GIORNI_ALLARME()){ perche = giorni<1 ? 'finisce oggi' : `basta per ${num(giorni,0)} giorn${Math.round(giorni)===1?'o':'i'}`; gravita = giorni<1?2:1; }
    if(perche) out.push({p, q, giorni, perche, gravita});
  }
  return out.sort((a,b)=>b.gravita-a.gravita || (a.giorni??0)-(b.giorni??0));
}

/* ===== CALCOLATRICE DEI VINI ===== */
/* il coefficiente scende man mano che sale il costo della bottiglia */
const FASCE = [[9,3],[15,3],[22,2.75],[30,2.5],[45,2.25],[1e9,2]];
const MARGINE_MINIMO = 24;   /* € netti a bottiglia: stappare costa uguale, che sia un vino da 6 o da 15 € */
const coeffFascia = c => (FASCE.find(f=>c<=f[0])||FASCE[FASCE.length-1])[1];
/* prezzo netto consigliato: coefficiente, margine minimo, e mai meno della fascia precedente */
function nettoConsigliato(costo){
  const base = costo*coeffFascia(costo);
  const minimo = costo + MARGINE_MINIMO;
  let tetto = 0; /* quanto varrebbe la bottiglia più cara della fascia sotto */
  for(const [lim,k] of FASCE){ if(costo>lim) tetto = Math.max(tetto, lim*k); }
  return Math.max(base, minimo, tetto);
}
function coeffAuto(){
  const f=$('#f-calc'); if(!f) return; const c=parseN(f.elements['listino'].value);
  if(c>0 && !f.dataset.manuale) f.elements['coeff'].value = fmtIn(+(nettoConsigliato(c)/c).toFixed(2));
}
function calcVini(f){
  const g = n => parseN(f.elements[n].value);
  const listino=g('listino'), pagate=g('pagate'), omaggio=g('omaggio'), coeff=g('coeff');
  const bott = pagate+omaggio;
  const spesa = listino*pagate;
  const reale = bott>0 ? spesa/bott : listino;
  const auto = f.dataset.manuale ? 0 : 1;
  const netto = auto ? nettoConsigliato(listino) : listino*coeff;
  const carta = Math.round(netto*1.10);
  const nettoCarta = carta/1.10;
  return {listino, pagate, omaggio, bott, spesa, reale, coeff, netto, carta, nettoCarta,
    margine: nettoCarta - listino, margineVero: nettoCarta - reale, sconto: (listino-reale)*bott,
    ogni100: nettoCarta>0 ? listino/nettoCarta*100 : 0,
    ogni100vero: nettoCarta>0 ? reale/nettoCarta*100 : 0,
    calice: Math.round(carta/4), costoCalice: reale/5, costoDeg: reale/8};
}

      <div class="numero"><span>Margine sul listino</span><b>${eur(r.margine)}</b></div>

/* ===== ORDINE AL FORNITORE SU WHATSAPP ===== */
/* come si ordina: a kg/litri se la fattura è a peso, altrimenti a confezioni (cassa, cartone…) */
function unitaOrdine(p){
  const um = umFatt(p), c = contenuto(p) || 1;
  if(['KG','KGM'].includes(um)) return {per:c, sing:'kg', plur:'kg', desc:''};
  if(['L','LT'].includes(um)) return {per:c, sing:'L', plur:'L', desc:''};
  if(c>1){ const conf = String(p.confezione||'').trim(); const m = conf.match(/^(cassa|cartone|confezione|scatola|busta|sacco|vaschetta|fardello|pacco)/i); const n = m ? m[1].toLowerCase() : 'confezione';
    const plur = {cassa:'casse',confezione:'confezioni',scatola:'scatole',busta:'buste',vaschetta:'vaschette',cartone:'cartoni',sacco:'sacchi',fardello:'fardelli',pacco:'pacchi'}[n] || (n.endsWith('o') ? n.slice(0,-1)+'i' : n.endsWith('a') ? n.slice(0,-1)+'e' : n);
    return {per:c, sing:n, plur, desc:conf}; }
  if(isBott(p)) return {per:+p.contenuto_conf, sing:'bottiglia', plur:'bottiglie', desc:''};
  return {per:c, sing:'pz', plur:'pz', desc:''};
}
function qtaSuggerita(p, q){
  const c = consumoGiorno(p.id); const min = p.scorta_minima!=null ? +p.scorta_minima : 0;
  const obiettivo = Math.max(min, c * GIORNI_ALLARME() * 2);
  const serve = Math.max(obiettivo - Math.max(q,0), 0); const u = unitaOrdine(p);
  return Math.max(1, Math.ceil(serve / u.per - 1e-9));
}
function telWhatsApp(t){ let d = String(t||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('00')) d = d.slice(2); if(!d.startsWith('39') || d.length<=10) d = '39'+d; return d; }
/* il messaggio si scrive dai dati, così è già pronto appena si apre l'ordine */
function testoOrdine(voci, quando='', nota=''){
  const righe = voci.map(({p,n})=>{ if(!p || !(n>0)) return null; const u=unitaOrdine(p);
    const qta = u.sing==='kg'||u.sing==='L' ? `${num(n,2)} ${u.sing}` : `${num(n,0)} ${n===1?u.sing:u.plur}`;
    return `- ${qta} ${p.nome}${p.annata?' '+p.annata:''}${u.desc?` (${u.desc})`:''}`; }).filter(Boolean);
  if(!righe.length) return '';
  return `Buongiorno, sono di 22 Cucina Isolana (Cefalù). Vorremmo ordinare:\n${righe.join('\n')}${quando?`\n\nConsegna: ${quando}`:''}${nota?`\n\n${nota}`:''}\n\nGrazie!`;
}
function aggiornaOrdine(){
  const f = $('#f-ordine'), t = $('#ord-testo'); if(!f || !t) return;
  const voci = [...f.querySelectorAll('[data-op]')].map(r=>({p:P(r.dataset.op), n:parseN(r.querySelector('input').value)}));
  t.value = testoOrdine(voci, f.elements['quando']?.value.trim()||'', f.elements['nota']?.value.trim()||'');
}

/* ===== IMPORTAZIONE DAL FILE DELLA CASSA ===== */
let IMP = null;
const parseImp = v => { let t=String(v??'').replace(/\s|€/g,''); if(t.includes(',') && t.includes('.')) t=t.replace(/\./g,''); return parseN(t); };
const normNome = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function caricaXLSX(){
  return window.XLSX ? Promise.resolve() : new Promise((ok,ko)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload=ok; sc.onerror=()=>ko(new Error('non riesco a caricare il lettore di Excel, controlla la connessione')); document.head.appendChild(sc); });
}
async function leggiFileCassa(file){
  await caricaXLSX();
  const testo = /\.(csv|txt)$/i.test(file.name);
  const wb = testo ? XLSX.read(await file.text(), {type:'string'}) : XLSX.read(await file.arrayBuffer(), {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''}).map(r=>r.map(c=>String(c).trim()));
  if(!rows.length) throw new Error('il file è vuoto');
  const RX_Q = /quant|qt[aà]?\b|qty|nb|nombre|numero|pezzi|vendut|vendus|n\.|pz/i, RX_N = /prod|artic|nome|name|item|descr|libell|d[eé]sign|voce/i;
  let h = rows.slice(0,25).findIndex(r=>r.some(c=>RX_Q.test(c)) && r.some(c=>RX_N.test(c)));
  if(h<0) h = rows.findIndex(r=>r.filter(Boolean).length>=2);
  if(h<0) h = 0;
  const larg = Math.max(...rows.map(r=>r.length));
  const intest = Array.from({length:larg}, (_,i)=>rows[h][i] || ('Colonna '+(i+1)));
  const corpo = rows.slice(h+1);
  let iNome = intest.findIndex(c=>RX_N.test(c)); if(iNome<0) iNome = 0;
  let iQta = intest.findIndex((c,i)=>i!==iNome && RX_Q.test(c));
  if(iQta<0) iQta = intest.findIndex((c,i)=>i!==iNome && corpo.some(r=>/^\d+([.,]\d+)?$/.test(r[i]||'')));
  const iTot = (i=>i>=0?i:intest.findIndex(c=>/vendit|totale|importo|incass/i.test(c)))(intest.findIndex(c=>/vendit.*incl|totale.*incl|lordo/i.test(c)));
  const iCat = intest.findIndex(c=>/categor|famiglia|reparto/i.test(c));
  IMP = {nomeFile:file.name, rows:corpo, intest, iNome, iQta:Math.max(0,iQta), iTot, iCat};
  impCalcola();
}
const PIA = id => (RAW.piatti||[]).find(p=>p.id===id);
const repDi = p => (p && p.reparto) || 'cucina';
function impCalcola(){
  const m = new Map(); IMP.coperti = null;
  for(const r of IMP.rows){
    const nome = (r[IMP.iNome]||'').trim(); if(!nome || /^(sub)?total/i.test(nome)) continue;
    const q = parseImp(r[IMP.iQta]); if(!(q>0)) continue;
    const k = normNome(nome);
    if(k==='coperto' || k==='coperti'){ IMP.coperti = (IMP.coperti||0) + Math.round(q); continue; }
    const x = m.get(k) || {nome, q:0, tot:0, cat:IMP.iCat>=0 ? (r[IMP.iCat]||'') : ''}; x.q += q; if(IMP.iTot>=0) x.tot += parseImp(r[IMP.iTot]); m.set(k, x);
  }
  const abb = new Map((RAW.abbina||[]).map(a=>[a.nome_cassa, a]));
  const art = (RAW.piatti||[]).filter(p=>p.attivo);
  IMP.voci = [...m.entries()].map(([k,x])=>{
    const perc = / p$/.test(k);   /* «Capone - P» = lo stesso piatto, servito nel percorso (menu): in cassa costa 0 */
    const k2 = k.replace(/ p$/,'');
    const a = abb.get(k) || (perc ? abb.get(k2) : abb.get(k+' p'));
    let pid = a ? (a.ignora ? 'ignora' : a.piatto_id) : '';
    if(!a){
      const e = art.find(p=>{ const n=normNome(p.nome); return n===k || n===k2; }) || (c=>c.length===1?c[0]:null)(art.filter(p=>{ const n=normNome(p.nome); return n.length>3 && (n.includes(k2) || k2.includes(n)); }));
      if(e) pid = e.id; }
    if(pid && pid!=='ignora' && !PIA(pid)) pid = '';
    return {k, nome:x.nome, cat:x.cat, perc, q:Math.round(x.q*100)/100, prezzoCassa: IMP.iTot>=0 && x.q>0 ? x.tot/x.q : null, pid, ricordato:!!abb.get(k)};
  }).sort((a,b)=>(a.pid?1:0)-(b.pid?1:0) || a.nome.localeCompare(b.nome,'it'));
}
function vImport(){

  const gruppi = (rep, pors, et) => pors.map(po=>{ const l=art.filter(p=>repDi(p)===rep && p.portata===po).sort(byNome); return l.length?`<optgroup label="${et} · ${esc(po)}">${l.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</optgroup>`:''; }).join('');

  const opz = sel => sel ? OPZ.replace(`value="${sel}"`, `value="${sel}" selected`) : OPZ;

  const gia = sv ? (RAW.mpiatti_mov||[]).filter(m=>m.servizio_id===sv.id && (m.tipo==='venduto'||m.tipo==='surplus')).length : 0;
  const conta = {cucina:0, sala:0, ignora:0, fare:0}; const pz = {cucina:0, sala:0};

  return `<div class="pannello"><div class="pannello-titolo">${esc(IMP.nomeFile)}</div>
    <div class="numeri">
      <div class="numero"><span>Alla cucina</span><b>${num(pz.cucina,0)}</b><small style="display:block;color:var(--grigio);font-weight:600">${conta.cucina} voci</small></div>
      <div class="numero"><span>Alla sala</span><b>${num(pz.sala,0)}</b><small style="display:block;color:var(--grigio);font-weight:600">${conta.sala} voci</small></div>
      <div class="numero"><span>Saltate</span><b>${conta.ignora}</b><small style="display:block;color:var(--grigio);font-weight:600">menu, voci solo d'incasso</small></div>
      <div class="numero"><span>Da decidere</span><b class="${conta.fare?'neg':''}">${conta.fare}</b><small style="display:block;color:var(--grigio);font-weight:600">in giallo qui sotto</small></div>
    </div>
    <p class="aiuto">Ogni voce della cassa va a un piatto della cucina o a un articolo della sala, oppure si salta. I menu si saltano: i loro piatti arrivano già come voci «- P» (percorso), che sono lo stesso piatto della carta con prezzo 0 in cassa. «Capone» e «Capone - P» vanno allo stesso piatto e scaricano la stessa scheda. Le scelte vengono ricordate: la volta dopo si abbina tutto da solo.</p>
    ${IMP.coperti!=null?`<label style="flex-direction:row;align-items:center;gap:10px;color:var(--inchiostro);font-weight:600;margin-top:10px"><input type="checkbox" id="imp-coperti" checked style="min-height:auto;width:20px;height:20px"> Coperti dalla cassa: ${num(IMP.coperti,0)}. Salvali nel turno (scarica anche pane e tovagliato).</label>`:''}
    ${gia?`<div class="avviso">In questo giorno e turno ci sono già ${gia} vendite registrate. Controlla di non caricare due volte lo stesso rapporto.</div>`:''}
    ${IMP.voci.length ? `<form id="f-import">${tabella(['Voce della cassa','#Quantità','Va a'], IMP.voci.map((v,i)=>{ const p=v.pid&&v.pid!=='ignora'?PIA(v.pid):null; const diff = p && !v.perc && v.prezzoCassa>0 && +p.prezzo>0 && Math.abs(v.prezzoCassa - +p.prezzo)>0.05;
      return `<tr class="${v.pid?'':'imp-da'}">${td(esc(v.nome)+(v.perc?' <span class="chip">percorso</span>':'')+(v.cat?` <small style="color:var(--grigio)">${esc(v.cat)}</small>`:'')+(diff?`<br><span class="chip ambra">in cassa ${eur(v.prezzoCassa)}, nell'app ${eur(+p.prezzo)}</span>`:''))}${td(num(v.q,2),1)}<td>${p?`<span class="chip">${repDi(p)}</span> `:''}<select class="imp-sel" name="v_${i}" data-i="${i}" aria-label="Dove va ${esc(v.nome)}">${opz(v.pid)}</select></td></tr>`; }))}
      <p class="nota">Le vendite vanno su ${esc(dataIt(ui.svData))}, ${esc(ui.svTurno)}. Cucina: prima dalle porzioni in linea, il resto dal magazzino. Sala: dal magazzino.</p>
      <details style="margin-top:6px"><summary style="cursor:pointer;color:var(--grigio)">Colonne del file</summary><div class="riga" style="margin-top:8px"><label>Nome<select id="imp-col-nome">${optCol(IMP.iNome)}</select></label><label>Quantità<select id="imp-col-qta">${optCol(IMP.iQta)}</select></label></div></details>
      <div class="riga" style="margin-top:12px"><button class="btn" type="submit">Registra le vendite</button><button class="btn sec" type="button" data-act="imp-annulla">Annulla</button></div>
    </form>` : `<div class="avviso">Non trovo quantità in questo file.</div><div class="riga" style="margin-top:8px"><label>Nome<select id="imp-col-nome">${optCol(IMP.iNome)}</select></label><label>Quantità<select id="imp-col-qta">${optCol(IMP.iQta)}</select></label></div><div style="margin-top:10px"><button class="btn sec" type="button" data-act="imp-annulla">Annulla</button></div>`}
  </div>`;
}

/* tutte le voci della cassa che si saltano: si possono associare da qui */
function vVociSaltate(){

  const art = (RAW.piatti||[]).filter(p=>p.attivo);
  const gruppi = (rep, pors, et) => pors.map(po=>{ const l=art.filter(p=>repDi(p)===rep && p.portata===po).sort(byNome); return l.length?`<optgroup label="${et} · ${esc(po)}">${l.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</optgroup>`:''; }).join('');

    <div style="margin-top:12px"><button class="btn" type="submit">Salva le associazioni</button></div>

/* cosa ha caricato il rapporto di vendita in un giorno: piatti, articoli, coperti e cosa hanno scaricato */
function vRapportoGiorno(){
  const giorno = ui.rvData || ui.svData;
  const svs = (RAW.servizi||[]).filter(x=>x.data===giorno && (ui.rvTurno==='tutti' || x.turno===ui.rvTurno));
  const ids = new Set(svs.map(x=>x.id));
  const mp = (RAW.mpiatti_mov||[]).filter(m=>ids.has(m.servizio_id) && /cassa/.test(m.motivo||''));
  const cop = svs.reduce((s,x)=>s + (+x.coperti||0), 0);
  const movCop = (RAW.movimenti||[]).filter(m=>ids.has(m.servizio_id) && m.tipo==='coperti');
  const prima = REP; const sezioni = [];
  try{
    for(const r of ['cucina','sala']){
      REP = r; applicaReparto();
      const mie = mp.filter(m=>PI(m.piatto_id));
      const perPiatto = new Map();
      for(const m of mie){ const x = perPiatto.get(m.piatto_id) || {q:0, note:[], mids:[]}; x.q += +m.porzioni; x.mids.push(m.id); const n=(m.motivo||'').replace(/^dalla cassa( · )?/,''); if(n) x.note.push(n); perPiatto.set(m.piatto_id, x); }
      const righe = [...perPiatto.entries()].map(([pid,x])=>{ const p=PI(pid);
        const ingr = new Map(); for(const mv of S.movimenti.filter(mv=>x.mids.includes(mv.movimento_piatto_id))){ ingr.set(mv.prodotto_id, (ingr.get(mv.prodotto_id)||0) + +mv.quantita); }
        const costoM = [...ingr.entries()].reduce((s,[id,q])=>s + q*costo(id), 0);
        const ingrTxt = [...ingr.entries()].map(([id,q])=>`${esc(P(id)?.nome||'?')} <b>${fq(id,q)}</b>`).join('<br>');
        return {p, q:x.q, note:[...new Set(x.note)].join('; '), ingr, ingrTxt, costoM}; }).sort((a,b)=>(a.p.portata||'').localeCompare(b.p.portata||'') || byNome(a.p,b.p));
      const extra = r==='sala' ? movCop.filter(m=>P(m.prodotto_id)).map(m=>({p:P(m.prodotto_id), q:+m.quantita, qTxt:fq(m.prodotto_id,+m.quantita), costoM:+m.quantita*costo(m.prodotto_id)})) : [];
      sezioni.push({r, righe, extra});
    }
  } finally { REP = prima; applicaReparto(); }
  /* voci della cassa non associate: saltate nel rapporto del giorno, e piatti/articoli senza scheda */
  const rapp = (RAW.rapporti||[]).filter(x=>x.data===giorno && (ui.rvTurno==='tutti' || x.turno===ui.rvTurno));
  const saltate = new Map(); for(const x of rapp) for(const v of (x.voci||[])) if(!v.pid){ const y=saltate.get(v.k)||{nome:v.nome, cat:v.cat, q:0}; y.q+=+v.q; saltate.set(v.k,y); }
  const senzaSch = sezioni.flatMap(z=>z.righe.filter(x=>!x.ingr.size).map(x=>({nome:x.p.nome, q:x.q, r:z.r})));
  const nonAss = `<div class="gruppo-titolo" style="margin-top:18px">Non associato</div>
    ${rapp.length ? (saltate.size ? tabella(['Voce della cassa (saltata)','Categoria','#Quantità'], [...saltate.values()].sort((a,b)=>b.q-a.q).map(y=>`<tr>${td(esc(y.nome))}${td(esc(y.cat||''))}${td(num(y.q,0),1)}</tr>`)) : '<p class="nota">Nessuna voce saltata.</p>')
      : '<p class="nota">Le voci saltate si vedono per i rapporti caricati da adesso in poi.</p>'}
    ${senzaSch.length ? tabella(['Associato ma senza scheda: non scarica niente','Reparto','#Quantità'], senzaSch.map(x=>`<tr>${td(esc(x.nome))}${td(x.r==='cucina'?'Cucina':'Sala')}${td(num(x.q,0),1)}</tr>`)) : ''}`;
  const blocco = ({r, righe, extra}) => {
    if(!righe.length && !extra.length) return `<div class="gruppo-titolo" style="margin-top:16px">${r==='cucina'?'Cucina':'Sala'}</div><p class="vuoto">Niente.</p>`;
    const tot = righe.reduce((s,x)=>s+x.costoM,0) + extra.reduce((s,x)=>s+x.costoM,0);

function opzioniUmCarico(p){
  const o=[]; const c=contenuto(p); const um=umFatt(p);
  if(isBott(p)) return [{v:'fatt', l:'bottiglie', mul:+p.contenuto_conf}];
  if(c && c!==1 && !['KG','KGM','L','LT'].includes(um)) o.push({v:'fatt', l:`${um||'unità'} da ${fq(p,c)}`, mul:c});
  o.push({v:'base', l:nomeBig(p), mul:mulBig(p)});
  return o;
}
function calcCarico(f){
  const p = P(f.elements['prodotto_id'].value); if(!p) return null;
  const u = U[p.unita];
  const sel=f.elements['um_c']; const opz=opzioniUmCarico(p);
  if(sel.dataset.pid!==p.id){ sel.innerHTML=opz.map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join(''); sel.dataset.pid=p.id; }
  const mulC=(opz.find(o=>o.v===sel.value)||opz[0]).mul;
  const comprato = parseN(f.elements['comprato'].value)*mulC;
  const pulRaw = f.elements['pulito'] ? f.elements['pulito'].value.trim() : '';
  const pulito = pulRaw==='' ? comprato : parseN(pulRaw)*u.mul;
  const prezzo = parseN(f.elements['prezzo'].value);
  const sfrido = comprato>0 && pulito>0 ? (1-pulito/comprato)*100 : NaN;
  const cu = pulito>0 ? prezzo/pulito : NaN;
  return {p,u,comprato,pulito,prezzo,sfrido,cu};
}
function aggiornaCalcCarico(){
  const f = $('#f-carico'); if(!f) return;
  const r = calcCarico(f); const box = $('#carico-calc');
  if(!r){ box.innerHTML=''; return; }

function formIngrediente(id, attr){
  return `<form id="${id}" ${attr}>
    <div class="add-row">
      <input class="cerca-box" name="cerca" list="dl-prodotti" autocomplete="off" placeholder="Cerca un prodotto…" aria-label="Cerca prodotto" required>
      <input name="quantita" inputmode="decimal" placeholder="Quantità" aria-label="Quantità" required>
      <select name="um" aria-label="Unità di misura">${Object.keys(UM).filter(u=>u!=='bott'||SALA()).map(u=>`<option value="${u}">${u==='bott'?'bott.':u}</option>`).join('')}</select>
      <button class="btn" type="submit">Aggiungi</button>
    </div>
    <div class="esito-cerca nota" style="margin:6px 0 0"></div>
  </form>`;
}
function righeRicetta(righe, delAct){
  let senza=0, con=0; const avvisi=[];
  const rows = righe.map(r=>{
    const p=P(r.prodotto_id); const q=+r.quantita;
    const c=q*costo(r.prodotto_id), ci=q*costoIvato(r.prodotto_id); senza+=c; con+=ci;
    if(p && !costo(r.prodotto_id)) avvisi.push(`${p.nome}: manca il prezzo${p.ultimo_prezzo!=null && !contenuto(p) ? ' (scrivi il contenuto della confezione)' : ''}`);
    else if(p && p.categoria!=='preparazione' && p.iva_pct==null) avvisi.push(`${p.nome}: manca l'IVA`);
    const cont=contenuto(p); const eq = p && cont && cont!==1 && !(['KG','KGM','L','LT'].includes(umFatt(p))) ? `<small>= ${num(q/cont,3)} ${esc(umFatt(p)||'conf.')} da ${fq(p,cont)}</small>` : '';
    return `<div class="ingr"><span class="ingr-nome">${esc(p?.nome||'?')}${eq}</span><span class="ingr-q">${fq(r.prodotto_id,q)}</span><span class="ingr-e">${eur(c)}</span><button class="x" data-act="${delAct}" data-id="${r.id}" aria-label="Togli ${esc(p?.nome||'')}">✕</button></div>`;
  });
  return {html: rows.length ? `<div class="ingr-lista">${rows.join('')}</div>` : '<p class="vuoto">Nessun ingrediente ancora: cercalo qui sotto.</p>', senza, con, avvisi};
}
function boxCosti(t, titolo, extra=''){
  return `<div class="numeri">
    <div class="numero"><span>${titolo} senza IVA</span><b>${eur(t.senza)}</b></div>
    <div class="numero forte"><span>${titolo} con IVA</span><b>${eur(t.con)}</b></div>${extra}</div>
    ${t.avvisi.length?`<div class="avviso">Costo incompleto. ${t.avvisi.map(esc).join(' · ')}</div>`:''}`;
}

    <form id="f-crea-art" class="griglia" data-id="${p.id}">
      <label>Prezzo ${vino?'della bottiglia':'a pezzo'} (€)<input name="prezzo_intero" inputmode="decimal" placeholder="vuoto = non si vende intero"></label>
      ${sfuso?`<label>${vino?'Calici da una bottiglia':'Bicchieri da una bottiglia'}<input name="quanti" inputmode="decimal" value="${vino?5:dist?Math.round(+p.contenuto_conf/40):''}"></label>
      <label>Prezzo ${vino?'del calice':'del bicchiere'} (€)<input name="prezzo_calice" inputmode="decimal" placeholder="vuoto = non si vende sfuso"></label>`:''}
      ${vino?`<label style="grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;color:var(--inchiostro);font-weight:600"><input type="checkbox" name="deg" style="min-height:auto;width:20px;height:20px"> Anche in degustazione: 8 assaggi da una bottiglia, prezzo 0</label>`:''}
      <button class="btn" type="submit">Crea articoli</button>
    </form>
    ${vino?`<p class="nota">5 calici da una bottiglia da ${fq(p,+p.contenuto_conf)}, quindi ${num(+p.contenuto_conf/5,0)} ml a calice. In degustazione 8 assaggi, ${num(+p.contenuto_conf/8,0)} ml l'uno.</p>`:''}`}</div>`;
}

/* ===== RESE ===== */
function vRese(){
  const gruppi = S.prodotti.map(p=>{
    const cs = S.carichi.filter(c=>c.prodotto_id===p.id && c.tipo==='acquisto' && c.peso_acquistato_g>0 && c.peso_pulito_g>0).sort((a,b)=>(a.data+a.created_at).localeCompare(b.data+b.created_at));
    if(!cs.length) return null;
    const sf = cs.map(c=>(1-c.peso_pulito_g/c.peso_acquistato_g)*100);
    const media = sf.reduce((a,b)=>a+b,0)/sf.length; const ultimo = sf[sf.length-1];
    return {p, n:cs.length, media, ultimo, cu:+cs[cs.length-1].costo_unitario, peggio: cs.length>1 && ultimo>media+5};
  }).filter(Boolean).sort((a,b)=>byNome(a.p,b.p));
  return `<h2 class="titolo">Rese</h2>
  <p class="intro">Quanto resta dopo pulizia e cottura, e quanto costa davvero quello che finisce nel piatto.</p>
  ${det('re-calc','Calcolatrice', `
    <form id="f-resa" class="griglia" onsubmit="return false">
      <label>Prezzo pagato (€)<input name="prezzo" inputmode="decimal" value="20"></label>
      <label>Peso comprato (kg)<input name="comprato" inputmode="decimal" value="1"></label>
      <label>Peso dopo la pulizia (kg)<input name="pulito" inputmode="decimal" value="0,6"></label>
      <label>Peso dopo la cottura (kg, se serve)<input name="cotto" inputmode="decimal"></label>
      <label>Grammi nel piatto<input name="porzione" inputmode="decimal" value="100"></label>
    </form>
    <div id="resa-calc"></div>
    <p class="nota">Esempio: compri 1 kg di pesce a 20 €, pulito ne restano 600 g. Quei 600 g costano 20 €: il costo vero è 33,33 € al kg, non 20 €.</p>`)}
  ${det('re-storico','Rese dei carichi, prodotto per prodotto', tabella(['Prodotto','#Carichi','#Sfrido medio','#Ultimo sfrido','#Ultimo costo vero',''],
    gruppi.map(g=>`<tr>${td(esc(g.p.nome))}${td(g.n,1)}${td(pct(g.media),1)}${td(pct(g.ultimo),1)}${td(fc(g.p,g.cu),1)}${td(g.peggio?'<span class="chip rosso">resa peggiorata</span>':'')}</tr>`),
    'Nessun carico con pesi ancora.'))}
  <p class="nota">«Resa peggiorata» compare quando l'ultimo carico ha più di 5 punti di sfrido rispetto alla media: vale la pena parlarne con il fornitore.</p>`;
}
function aggiornaCalcolatrice(){
  const f=$('#f-resa'); if(!f) return;
  const g = n => parseN(f.elements[n].value);
  const prezzo=g('prezzo'), comp=g('comprato'), pul=g('pulito'), cot=g('cotto'), gp=g('porzione');
  const fin = cot>0 ? cot : pul;
  const sfr = comp>0&&pul>0 ? (1-pul/comp)*100 : NaN;
  const calo = pul>0&&cot>0 ? (1-cot/pul)*100 : NaN;
  const kgPul = pul>0 ? prezzo/pul : NaN, kgFin = fin>0 ? prezzo/fin : NaN;
  const crudo = fin>0&&comp>0&&gp>0 ? gp*comp/fin : NaN;
  const cPorz = kgFin>0&&gp>0 ? kgFin*gp/1000 : NaN;
  $('#resa-calc').innerHTML = `<div class="calc">
    <div><span>Sfrido (pulizia)</span><b>${pct(sfr)}</b></div>
    <div><span>Calo in cottura</span><b>${pct(calo)}</b></div>
    <div><span>Costo vero al kg pulito</span><b>${isFinite(kgPul)?eur(kgPul):'—'}</b></div>
    <div><span>Costo vero al kg ${cot>0?'cotto':'pulito'}</span><b>${isFinite(kgFin)?eur(kgFin):'—'}</b></div>
    <div><span>Crudo da comprare per ${num(gp,0)} g nel piatto</span><b>${isFinite(crudo)?num(crudo,0)+' g':'—'}</b></div>
    <div><span>Costo della porzione</span><b>${isFinite(cPorz)?eur(cPorz):'—'}</b></div></div>`;
}

/* ===== CONTROLLO ===== */
function vControllo(){
  const da=ui.coDa, a=ui.coA;
  const inP = d => d>=da && d<=a;
  const iniziale = valore(addDays(da,-1)), finale = valore(a);
  const comprato = S.carichi.filter(c=>c.tipo==='acquisto' && inP(c.data) && isFood(P(c.prodotto_id))).reduce((s,c)=>s + +c.prezzo, 0);
  const nf = p => p && NON_FOOD.has(p.categoria) && !['tovagliato','pane e coperto'].includes(p.categoria);
  const nfIni = valore(addDays(da,-1), nf), nfFin = valore(a, nf);
  const nfComp = S.carichi.filter(c=>c.tipo==='acquisto' && inP(c.data) && nf(P(c.prodotto_id))).reduce((s,c)=>s + +c.prezzo, 0);
  const nfUsato = nfIni + nfComp - nfFin;
  const nfPerCat = ['pulizia','materiali'].map(cat=>{ const f=p=>p&&p.categoria===cat; const i=valore(addDays(da,-1),f), fi=valore(a,f), c=S.carichi.filter(x=>x.tipo==='acquisto'&&inP(x.data)&&f(P(x.prodotto_id))).reduce((s,x)=>s + +x.prezzo,0); return {cat, i, c, fi, u:i+c-fi}; });
  const usato = iniziale + comprato - finale;
  const mpP = S.mpiatti_mov.filter(m=>inP(m.data));
  const vendutiP = mpP.filter(m=>m.tipo==='venduto' || m.tipo==='surplus');
  const teorico = vendutiP.reduce((s,m)=>s + +m.porzioni*costoPiatto(m.piatto_id), 0);
  const movP = S.movimenti.filter(m=>inP(m.data) && isFood(P(m.prodotto_id)));
  const eurMov = m => +m.quantita*costo(m.prodotto_id);
  const scarti = movP.filter(m=>m.tipo==='scarto'), pasti = movP.filter(m=>m.tipo==='pasto_personale'), omaggi = movP.filter(m=>m.tipo==='omaggio');
  const ammanchi = movP.filter(m=>m.tipo==='rettifica' && m.da), trovati = movP.filter(m=>m.tipo==='rettifica' && m.a);
  const sScarti = scarti.reduce((s,m)=>s+eurMov(m),0), sPasti = pasti.reduce((s,m)=>s+eurMov(m),0), sOmaggi = omaggi.reduce((s,m)=>s+eurMov(m),0);
  const spiegato = teorico + sScarti + sPasti + sOmaggi;
  const nonSpiegato = usato - spiegato;
  const surplus = mpP.filter(m=>m.tipo==='surplus');
  /* in sala l'incasso si ricava dai prezzi degli articoli venduti (IVA 10% tolta) */
  const incassoSala = vendutiP.reduce((s,m)=>{ const p=PI(m.piatto_id); return s + (p ? +m.porzioni*prezzoNetto(p) : 0); }, 0);
  const incasso = SALA() ? incassoSala : parseN(ui.incasso);
  const coperti = S.servizi.filter(x=>inP(x.data) && x.coperti!=null).reduce((s,x)=>s + +x.coperti, 0);
  const ogni100 = x => incasso>0 ? eur(x/incasso*100) : '—';
  const nomeRiga = m => m.movimento_piatto_id ? `${esc(P(m.prodotto_id)?.nome||'?')} <small style="color:var(--grigio)">(${esc(PI(S.mpiatti_mov.find(x=>x.id===m.movimento_piatto_id)?.piatto_id)?.nome||'piatto')})</small>` : esc(P(m.prodotto_id)?.nome||'?');

  return `<h2 class="titolo">Controllo</h2>
  <p class="intro">Il conto della merce, come a scuola: c'era + comprato − rimasto = usato.</p>
  <div class="riga" style="margin-bottom:12px">
    <label>Dal<input type="date" id="co-da" value="${da}"></label>
    <label>Al<input type="date" id="co-a" value="${a}"></label>
    <button class="btn sec" data-act="co-settimana">Questa settimana</button>
    <button class="btn sec" data-act="co-mese">Questo mese</button>
  </div>
  ${det('co-sintesi','Il conto della merce', `
    <div class="equazione">
      <div class="blocco"><small>C'era</small><b>${eur(iniziale)}</b></div><span class="op">+</span>
      <div class="blocco"><small>Comprato</small><b>${eur(comprato)}</b></div><span class="op">−</span>
      <div class="blocco"><small>Rimasto</small><b>${eur(finale)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Usato</small><b>${eur(usato)}</b></div>
    </div>
    <div class="equazione">
      <div class="blocco"><small>${SALA()?'Serviva per il venduto':'Serviva per i piatti venduti'}</small><b>${eur(teorico)}</b></div><span class="op">+</span>
      <div class="blocco"><small>${SALA()?'Rotture segnate':'Scarti segnati'}</small><b>${eur(sScarti)}</b></div><span class="op">+</span>
      ${SALA()?`<div class="blocco"><small>Omaggi</small><b>${eur(sOmaggi)}</b></div><span class="op">+</span>`:''}
      <div class="blocco"><small>${SALA()?'Consumo del personale':'Pasto personale'}</small><b>${eur(sPasti)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Uso spiegato</small><b>${eur(spiegato)}</b></div>
    </div>
    <div class="equazione">
      <div class="blocco fine"><small>Usato</small><b>${eur(usato)}</b></div><span class="op">−</span>
      <div class="blocco fine"><small>Uso spiegato</small><b>${eur(spiegato)}</b></div><span class="op">=</span>
      <div class="blocco ${nonSpiegato>0.5?'allarme':'fine'}"><small>Non spiegato</small><b>${eur(nonSpiegato)}</b></div>
    </div>
    <p class="nota">${SALA()?'«Non spiegato» è la merce uscita senza un articolo venduto, un omaggio o una rottura segnata. Se è alto, si guarda dove nasce: conte, calici più abbondanti, bottiglie non battute in cassa.':'«Non spiegato» è la merce uscita senza un piatto venduto o uno scarto segnato. Se è alto, si guarda insieme dove nasce: conte, grammature fuori scheda, scarti non segnati.'}</p>
    ${SALA()?`<div class="calc"><div><span>Incasso bevande dal venduto (IVA esclusa)</span><b>${eur(incasso)}</b></div><div><span>Coperti nel periodo</span><b>${coperti?num(coperti,0):'—'}</b></div><div><span>Bevande usate per coperto</span><b>${coperti?eur(usato/coperti):'—'}</b></div></div>`
      :`<div class="riga" style="margin-top:14px"><label>Incasso della cucina nel periodo (€, IVA esclusa)<input id="co-incasso" inputmode="decimal" value="${esc(ui.incasso)}" placeholder="facoltativo"></label></div>`}
    ${incasso>0?`<div class="calc">
      <div><span>Merce usata ogni 100 € incassati</span><b>${ogni100(usato)}</b></div>
      <div><span>Secondo le schede</span><b>${ogni100(teorico)}</b></div>
      <div><span>Differenza ogni 100 €</span><b>${ogni100(usato-teorico)}</b></div></div>`:''}
    <p class="nota">I valori usano l'ultimo costo vero di ogni prodotto. Il conto è preciso solo se all'inizio e alla fine del periodo il magazzino è stato contato.</p>`)}

  ${det('co-confronto','Comprato e usato, prodotto per prodotto', vConfronto(da,a), 'dove nasce la differenza')}

  ${SALA()?det('co-famiglie','Incasso e costo per famiglia', vFamiglie(vendutiP)):''}

  ${SALA()?det('co-coperto','Il coperto', vCoperto(inP, coperti)):''}

  ${SALA()?det('co-tovagliato','Tovagliato a noleggio', vTovagliato(inP, coperti)):''}

  ${det('co-nonfood', SALA()?'Materiali e pulizia di sala':'Pulizia e materiali di consumo', `
    <p class="nota" style="margin-top:12px">${SALA()?'Non sono bevande: stanno fuori dal costo delle bevande.':'Non sono cibo: stanno fuori dal food cost.'} Si contano a fine mese e l'app calcola quanto è stato usato.</p>
    <div class="equazione">
      <div class="blocco"><small>C'era</small><b>${eur(nfIni)}</b></div><span class="op">+</span>
      <div class="blocco"><small>Comprato</small><b>${eur(nfComp)}</b></div><span class="op">−</span>
      <div class="blocco"><small>Rimasto</small><b>${eur(nfFin)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Usato</small><b>${eur(nfUsato)}</b></div>
    </div>
    ${tabella(['Famiglia','#C\'era','#Comprato','#Rimasto','#Usato'], nfPerCat.map(r=>`<tr>${td(r.cat)}${td(eur(r.i),1)}${td(eur(r.c),1)}${td(eur(r.fi),1)}${td('<b>'+eur(r.u)+'</b>',1)}</tr>`))}
    ${(()=>{ const vp=S.mpiatti_mov.filter(m=>inP(m.data)&&(m.tipo==='venduto'||m.tipo==='surplus')).reduce((s,m)=>s + +m.porzioni,0); return SALA() ? (coperti?`<div class="calc"><div><span>Materiali e pulizia per coperto</span><b>${eur(nfUsato/coperti)}</b></div></div>`:'') : vp>0?`<div class="calc"><div><span>Pulizia e materiali per piatto venduto</span><b>${eur(nfUsato/vp)}</b></div></div>`:''; })()}`)}

  ${SALA()?'':det('co-surplus','Venduti più di quelli in linea (surplus)', tabella(['Giorno','Piatto','#Porzioni','#Valore'],
    surplus.map(m=>`<tr>${td(dataIt(m.data))}${td(esc(PI(m.piatto_id)?.nome||'?'))}${td(num(m.porzioni),1)}${td(eur(+m.porzioni*costoPiatto(m.piatto_id)),1)}</tr>`), 'Nessun surplus nel periodo.'), surplus.length?surplus.length+' volte':'')}

  ${det('co-conte','Conte fatte', vConteFatte(inP), (n=>n?n+(n===1?' conta':' conte'):'')(S.conte.filter(c=>inP(c.data)).length))}

  ${det('co-conta','Differenze alla conta', tabella(['Giorno','Prodotto','Dove','Differenza','#Valore'],
    [...ammanchi.map(m=>`<tr>${td(dataIt(m.data))}${td(esc(P(m.prodotto_id)?.nome||'?'))}${td(m.da)}${td(`<span class="neg">mancano ${fq(m.prodotto_id,+m.quantita)}</span>`)}${td(`<span class="neg">−${eur(eurMov(m))}</span>`,1)}</tr>`),
     ...trovati.map(m=>`<tr>${td(dataIt(m.data))}${td(esc(P(m.prodotto_id)?.nome||'?'))}${td(m.a)}${td(`in più ${fq(m.prodotto_id,+m.quantita)}`)}${td('+'+eur(eurMov(m)),1)}</tr>`)],
    'Nessuna differenza nel periodo.'))}

  ${det('co-scarti', SALA()?'Omaggi, rotture e consumo del personale':'Scarti e pasti del personale', tabella(['Giorno', SALA()?'Prodotto':'Ingrediente','Cosa','#Quantità','Motivo','#Valore'],
    [...scarti,...pasti,...omaggi].sort((x,y)=>y.data.localeCompare(x.data)).map(m=>`<tr>${td(dataIt(m.data))}${td(nomeRiga(m))}${td(esc(TIPI_MOV[m.tipo]))}${td(fq(m.prodotto_id,+m.quantita),1)}${td(esc(m.motivo||''))}${td(eur(eurMov(m)),1)}</tr>`),
    'Niente nel periodo.'))}`;
}

function vConfronto(da, a){
  const tutte = confronto(da, a);
  if(!tutte.length) return '<p class="vuoto">Niente comprato né usato nel periodo.</p>';
  const base = tutte.filter(r=>!r.prep);
  const T = k => base.reduce((s,r)=>s+r[k],0);
  const comp=T('eComp'), uso=T('eUso'), perso=T('ePerso'), manca=T('eManca'), vari=T('eVar');
  const dg = comp-uso-perso, altro = dg-manca-vari;
  const su100 = x => comp>0 ? eur(x/comp*100) : '—';
  const cats = [...new Set(tutte.map(r=>r.p.categoria))].sort((x,y)=>CATEGORIE.indexOf(x)-CATEGORIE.indexOf(y));
  const perCat = cats.filter(c=>c!=='preparazione').map(c=>{ const rr=base.filter(r=>r.p.categoria===c); const s=k=>rr.reduce((t,r)=>t+r[k],0);
    const cp=s('eComp'), gi=s('eUso')+s('ePerso'); return {c, cp, gi, dg:cp-gi}; }).sort((x,y)=>y.dg-x.dg);
  const righe = tutte.filter(r=>ui.cfCat==='tutte' || r.p.categoria===ui.cfCat).sort((x,y)=>y.daGiust-x.daGiust);
  const cell = (e, q, p, cls='') => `<td class="n" data-v="${e}"><span class="${cls}">${eur(e)}</span>${q!=null&&Math.abs(q)>=0.5?`<small class="q">${fq(p,q)}</small>`:''}</td>`;
  const rows = righe.map(r=>{
    const giust = r.eComp>0 ? Math.min(100, Math.max(0, (r.eUso+r.ePerso)/r.eComp*100)) : null;
    const gg = giorniDa(r.ultima);
    const daContare = r.eVar>15 && (gg==null || gg>7);
    const chips = (r.prep?' <span class="chip">preparazione</span>':'') + (daContare?' <span class="chip ambra">da contare</span>':'');
    return `<tr><td>${esc(r.p.nome)}${chips}${giust!=null?`<div class="barra" title="giustificato ${num(giust,0)}%"><i style="width:${giust}%"></i></div>`:''}</td>`
      + cell(r.eComp, r.qComp, r.p) + cell(r.eUso, r.qUso, r.p) + cell(r.ePerso, r.qPerso, r.p)
      + `<td class="n" data-v="${r.daGiust}"><b>${eur(r.daGiust)}</b></td>`
      + cell(r.eManca, r.qManca, r.p, r.eManca>0.5?'neg':'') + cell(r.eVar, r.qVar, r.p)
      + `<td data-v="${gg==null?9999:gg}">${r.ultima?dataIt(r.ultima)+(gg>0?`<small class="q">${gg===1?'ieri':gg+' giorni fa'}</small>`:'<small class="q">oggi</small>'):'<span class="chip ambra">mai</span>'}</td></tr>`;
  });
  if(ui.cfCat==='tutte') rows.push(`<tr class="tot"><td>Totale (senza preparazioni)</td>${td(eur(comp),1)}${td(eur(uso),1)}${td(eur(perso),1)}${td(eur(dg),1)}${td(eur(manca),1)}${td(eur(vari),1)}<td></td></tr>`);

  return `
    <div class="equazione">
      <div class="blocco"><small>Comprato</small><b>${eur(comp)}</b></div><span class="op">−</span>
      <div class="blocco"><small>Usato secondo le schede</small><b>${eur(uso)}</b></div><span class="op">−</span>
      <div class="blocco"><small>${SALA()?'Omaggi, rotture, personale':'Scarti e pasti segnati'}</small><b>${eur(perso)}</b></div><span class="op">=</span>
      <div class="blocco fine"><small>Da giustificare</small><b>${eur(dg)}</b></div>
    </div>
    ${comp>0?`<p class="frase">Su 100 € di merce comprata, ${SALA()?'il venduto ne giustifica':'le schede ne giustificano'} <b>${su100(uso)}</b> e ${SALA()?'omaggi, rotture e personale':'gli scarti segnati'} <b>${su100(perso)}</b>.</p>`:''}
    <div class="calc">
      <div><span>Da giustificare</span><b>${eur(dg)}</b></div>
      <div><span>di cui mancato alla conta</span><b>${eur(manca)}</b></div>
      <div><span>di cui ancora in magazzino secondo l'app</span><b>${eur(vari)}</b></div>
      ${Math.abs(altro)>=1?`<div><span>di cui prezzi cambiati nel periodo</span><b>${eur(altro)}</b></div>`:''}
    </div>
    <p class="nota">«Ancora in magazzino secondo l'app» è merce comprata che nessuna scheda ha fatto uscire. Finché non si conta, non si sa se c'è davvero: gli ammanchi si nascondono lì. I prodotti con <span class="chip ambra">da contare</span> sono i primi da controllare.</p>

    ${perCat.length>1?`<div class="pannello" style="margin-top:14px"><div class="pannello-titolo">Per famiglia</div>${tabella(['Famiglia','#Comprato','#Giustificato','#Da giustificare','#Giustificato %'],
      perCat.map(x=>`<tr>${td(esc(x.c))}<td class="n" data-v="${x.cp}">${eur(x.cp)}</td><td class="n" data-v="${x.gi}">${eur(x.gi)}</td><td class="n" data-v="${x.dg}"><b>${eur(x.dg)}</b></td><td class="n" data-v="${x.cp>0?x.gi/x.cp*100:-1}">${x.cp>0?pct(x.gi/x.cp*100):'—'}</td></tr>`))}</div>`:''}

    <div class="riga" style="margin-top:14px"><label>Famiglia<select id="cf-cat"><option value="tutte">Tutte</option>${cats.map(c=>`<option ${ui.cfCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
    ${tabella(['Prodotto','#Comprato', SALA()?'#Venduto':'#Usato (schede)', SALA()?'#Omaggi e rotture':'#Scarti e pasti','#Da giustificare','#Mancato alla conta','#In magazzino (app)','Ultima conta'], rows, 'Niente in questa famiglia.')}

function vCoperto(inP, coperti){

  const righe = [...perProd.entries()].map(([pid,q])=>({p:P(pid), q, e:q*costo(pid)})).filter(r=>r.p).sort((a,b)=>b.e-a.e);

    <div class="calc"><div><span>Coperti nel periodo</span><b>${num(coperti,0)}</b></div><div><span>Incasso coperto (senza IVA)</span><b>${eur(netto*coperti)}</b></div><div><span>Margine del coperto nel periodo</span><b>${eur(netto*coperti - tot)}</b></div></div>

function cgLontano(p, q, att){
  const d = Math.abs(q-att);
  const tol = p.unita==='pz' ? 1 : Math.max(20, 0.1*Math.abs(att));
  if(d<=tol) return false;
  const c = costo(p.id); if(c>0 && d*c<3) return false;
  return true;
}
function cgAvanti(f){
  const p = P(CG.ids[CG.i]); if(!p) return;
  const un = CG.un[p.id] || 'big'; const mul = un==='big' ? mulBig(p) : 1;
  const rm = f.elements['m'].value.trim(), rl = f.elements['l'] ? f.elements['l'].value.trim() : '';
  if(rm==='' && rl==='') return toast('Scrivi quanto ce n\'è, oppure premi «Non c\'è» o «Salta».','err');
  const m = rm==='' ? null : Math.max(0, parseN(rm)*mul), l = rl==='' ? null : Math.max(0, parseN(rl)*mul);
  const st = stock(p.id);
  const lontano = (m!=null && cgLontano(p,m,st.mag)) || (l!=null && cgLontano(p,l,st.lin));
  const w = CG.warn; const conferma = !!(w && w.pid===p.id && w.m===m && w.l===l);
  if(lontano && !conferma){ CG.warn = {pid:p.id, m, l}; cgSalva(); cgRender(); return; }
  CG.val[p.id] = {m, l, ric:conferma}; CG.warn = null;
  cgVai(CG.i+1);
}

  const data = localISO(), righe = [], mov = [];
  for(const id of CG.ids){
    const v = CG.val[id]; if(!v || !P(id)) continue; const st = stock(id);
    for(const [q,posto,att] of [[v.m,'magazzino',st.mag],[v.l,'linea',st.lin]]){
      if(q==null) continue;
      righe.push({prodotto_id:id, posto, atteso:+att.toFixed(3), contato:+q.toFixed(3), ricontato:!!v.ric});
      const diff = q-att; if(Math.abs(diff)<0.5) continue;
      mov.push(diff>0 ? {data, prodotto_id:id, tipo:'rettifica', a:posto, quantita:+diff.toFixed(3), motivo:'conta guidata: trovato in più'}
                      : {data, prodotto_id:id, tipo:'rettifica', da:posto, quantita:+(-diff).toFixed(3), motivo:'conta guidata: manca'});
    }
  }
  if(!righe.length) return toast('Non hai contato niente.','err');
  const valore = mov.reduce((s,m)=>s + (m.a?1:-1) * m.quantita * costo(m.prodotto_id), 0);
  const esito = {n:new Set(righe.map(r=>r.prodotto_id)).size, d:mov.length, valore};
  await run(async ()=>{
    const c = await insOne('conte', {data, turno:CG.turno||null, tipo:'guidata', cosa:CG.titolo||null, reparto:REP});
    await ins('conte_righe', righe.map(r=>({...r, conta_id:c.id})));
    if(mov.length) await ins('movimenti', mov.map(m=>({...m, conta_id:c.id})));
    CG.fase = 'fatto'; CG.esito = esito;
  });
  cgSalva(); cgRender();
}

}

document.addEventListener('submit', async e=>{
  const f=e.target; if(!f.id) return; e.preventDefault();
  const v = n => f.elements[n]?.value ?? '';
  const nOrNull = x => { const s=String(v(x)).trim(); return s==='' ? null : parseN(s); };
  switch(f.id){
    case 'f-tov-pezzo': {
      const nome=v('nome').trim(); if(!nome) return toast('Serve il nome.','err');
      const row={nome, ultimo_prezzo:nOrNull('prezzo'), pezzi_per_coperto:nOrNull('ppc'), dotazione:nOrNull('dot')};
      const id=f.dataset.id;
      run(async ()=>{ if(id==='new') await ins('prodotti',{...row, categoria:'tovagliato', unita:'pz', reparto:'sala', confezione:'pezzo', um_acquisto:'PZ', contenuto_conf:1, iva_pct:22}); else await upd('prodotti', id, row); ui.editTov=null; }, 'Pezzo salvato');
      break;
    }
    case 'f-tov-pass': {

      const righe=pezzi.map(p=>({p, r:parseN(v('r_'+p.id)), q:parseN(v('q_'+p.id)), pp:parseN(v('p_'+p.id))})).filter(x=>x.r>0 || x.q>0);
      if(!righe.length) return toast('Scrivi almeno un numero.','err');
      if(righe.some(x=>x.q>0 && !(x.pp>0))) return toast('Per i consegnati serve il prezzo a pezzo.','err');
      const car=righe.filter(x=>x.q>0), rit=righe.filter(x=>x.r>0);
      run(async ()=>{
        if(rit.length) await ins('movimenti', rit.map(x=>({data, prodotto_id:x.p.id, tipo:'reso', quantita:x.r, motivo:'ritirato dalla lavanderia'})));
        if(car.length){ await ins('carichi', car.map(x=>({data, prodotto_id:x.p.id, fornitore:nomeForn(x.p)||'lavanderia', peso_acquistato_g:x.q, peso_pulito_g:x.q, quantita:x.q, prezzo:+(x.q*x.pp).toFixed(2), costo_unitario:x.pp, tipo:'acquisto', note:'consegna lavanderia'})));
          for(const x of car) await upd('prodotti', x.p.id, {ultimo_prezzo:x.pp, ultima_quantita:x.q, data_ultima_fattura:data}); }
      }, 'Passaggio registrato: '+righe.map(x=>`${x.p.nome.toLowerCase()} ritirati ${num(x.r,0)}, consegnati ${num(x.q,0)}`).join('; '));
      break;

      const righe=pezzi.map(p=>({p, q:parseN(v('q_'+p.id)), pp:parseN(v('p_'+p.id))})).filter(x=>x.q>0);
      if(!righe.length) return toast('Scrivi almeno un pezzo consegnato.','err');

        for(const x of righe) await upd('prodotti', x.p.id, {ultimo_prezzo:x.pp, ultima_quantita:x.q, data_ultima_fattura:data});
      }, `Consegna caricata: ${righe.map(x=>num(x.q,0)+' '+x.p.nome.toLowerCase()).join(', ')}`);

    case 'f-tov-rit': {

      const p=trovaProdotto(v('cerca'), f.dataset.prep); if(!p) return toast('Prodotto non trovato: sceglilo dall\'elenco.','err');
      const q=parseN(v('quantita')); if(q<=0) return toast('Scrivi la quantità.','err');
      const [base,fatt0]=UM[v('um')]; if(base!==p.unita || (v('um')==='bott' && !isBott(p))) return toast(`${p.nome} si misura in ${umPer(p).join(' o ')}.`,'err');
      const fatt = v('um')==='bott' ? +p.contenuto_conf : fatt0;
      const qb=+(q*fatt).toFixed(3);
      run(()=> f.id==='f-pcomp' ? ins('piatto_componenti',{piatto_id:f.dataset.piatto, prodotto_id:p.id, quantita:qb}) : ins('prep_componenti',{prep_id:f.dataset.prep, prodotto_id:p.id, quantita:qb}), `Aggiunto: ${p.nome}`);
      break;
    }
    case 'f-piatto': {
      const row={nome:v('nome').trim(), portata:v('portata')}; if(!row.nome) return toast('Serve il nome.','err');
      if(f.elements['note']) row.note = v('note').trim()||null;
      if(f.elements['prezzo']) row.prezzo = nOrNull('prezzo');
      const id=f.dataset.id; if(id==='new') row.reparto = REP;
      run(async ()=>{ if(id==='new'){ const d=await insOne('piatti', row); ui.editPiatto=d.id; } else await upd('piatti', id, row); }, 'Piatto salvato');
      break;
    }
    case 'f-menu': {
      const row={nome:v('nome').trim(), prezzo:parseN(v('prezzo'))}; if(!row.nome) return toast('Serve il nome.','err');
      const scelti=[...f.querySelectorAll('input[name=piatto]:checked')].map(x=>x.value);
      const id=f.dataset.id;
      run(async ()=>{
        let mid=id;
        if(id==='new'){ mid=(await insOne('menu', row)).id; }
        else { await upd('menu', id, row); const {error}=await sb.from('menu_piatti').delete().eq('menu_id', id); if(error) throw error; }
        if(scelti.length) await ins('menu_piatti', scelti.map((pid,i)=>({menu_id:mid, piatto_id:pid, ordine:i})));
        ui.editMenu=null;
      }, 'Menu salvato');
      break;
    }
  }
});

/* ===== Avvio ===== */
sb.auth.onAuthStateChange(async (_ev, session)=>{
  const nuovo = session?.user || null;
  if(nuovo && (!ui.user || ui.user.id!==nuovo.id)){
    ui.user = nuovo;
    try{ busy(true); await loadAll(); }catch(e){ toast('Errore nel caricare i dati: '+e.message,'err'); } finally{ busy(false); }
    render(); cgRender();
  } else if(!nuovo){ ui.user=null; renderLogin(); cgRender(); }
});
renderLogin();
</script>
